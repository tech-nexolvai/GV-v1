# The case goods product pack (#1776): its registry entry and what it teaches the engines.
# What each field means: vocabulary/products.yaml (the registry's fields) and
# vocabulary/product_packs.py (the pack's own fields). Generic trade words only, no client values.

id: case_goods
label: Case good
plural: Case goods
description: >-
  Free-standing furniture such as dressers, desks, nightstands and wardrobes (draft).
active: false
draft: true
check_kinds: [dimension_match, global_rules]
checklist:
  - name: dimensions
    text: Overall width, depth and height; each drawer and door opening.
  - name: fronts
    text: Number of drawers and doors, how arranged, open shelves.
  - name: hardware
    text: Pulls, hinges, slides, locks and power units (type, size, finish).
  - name: finish
    text: Finish and material codes match the architect's or the specification.
  - name: quantities
    text: How many of each piece, and where each one goes.
  - name: notes
    text: Every note and callout on the architect's drawing or specification is followed.
global_rule_hints: []
words: [dresser, dressers, nightstand, nightstands, wardrobe, wardrobes]
