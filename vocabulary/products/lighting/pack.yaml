# The lighting product pack (#1776): its registry entry and what it teaches the engines.
# What each field means: vocabulary/products.yaml (the registry's fields) and
# vocabulary/product_packs.py (the pack's own fields). Generic trade words only, no client values.

id: lighting
label: Lighting
plural: Lighting
description: Light fixtures and lamps (draft starter checklist, not yet checked with GV).
active: false
draft: true
check_kinds: [dimension_match, global_rules]
checklist:
  - name: dimensions
    text: Fixture size (width, depth, height or diameter), mounting height, centre lines.
  - name: specs
    text: >-
      Lamp base, lamp type and wattage or lumens, colour temperature, cord and plug, mounting and canopy.
  - name: finish
    text: Finish and material codes match the architect's or the specification.
  - name: quantities
    text: How many of each fixture, and where each one goes.
  - name: notes
    text: Every note and callout on the architect's drawing or specification is followed.
global_rule_hints:
  - Lamp base type (for example E26).
  - Cord type and colour (for example a clear cord).
  - Plug type (for example a flat plug).
words: [light fixture, light fixtures, pendant, pendants, sconce, sconces, chandelier, luminaire, lamp,
  lamps]
