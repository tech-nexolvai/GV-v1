  - key: accessory_mounting_position
    asks: Where does this accessory sit, and how high?
    item_kinds: [accessory_detail]
    needs:
      - side: vendor
        fact: the height above the floor or below the cabinet, and the position along the wall
        view: elevation and section
      - side: architect
