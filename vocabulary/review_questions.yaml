        view: elevation
    rule: >-
      The mounting height and the position along the wall are compared with the architect's, in
      inches, exactly.
    problem_when: the height or the position differs from the architect's.
    not_a_problem_when:
      - The architect draws the accessory but prints no height; a scaled value never decides.
    decided_by: code
    from: true_answers
    source: >-
      GV's product checklist, accessories; derived from real findings on mounting heights.
    seen_as:
      created_by: [page_reviewer, helper, whole_look]
      words: ["below the", "above the floor", "mounting height", "spacing", "centres"]

  - key: accessory_finish_and_supply
    asks: What finish does this accessory carry and who supplies it?
    item_kinds: [accessory_detail]
    needs:
      - side: vendor
        fact: the accessory's finish tag and supply note
        view: detail, elevation and the material table
      - side: architect
        fact: the architect's finish or material for the accessory
        view: elevation or schedule
    rule: >-
      The item's sheet set must tag the accessory and say who supplies it.
    problem_when: the accessory is untagged on every sheet of the item, or no sheet says who supplies it.
    not_a_problem_when:
      - The tag is on another sheet of the same item.
    decided_by: ai
    from: true_answers
    source: >-
      GV's product checklist, accessories; derived from real findings on untagged frames and
      rails.
    seen_as:
      created_by: [page_reviewer, helper]
      words: ["untagged", "no finish tag", "who supplies", "by vendor"]

  # --- key plan --------------------------------------------------------------------------------

  - key: room_type_tags
    asks: Does each room's type tag on this key plan match the architect's tag for the same room?
    item_kinds: [key_plan]
    needs:
      - side: vendor
        fact: each room number and the type tag printed with it
        view: key_plan
      - side: architect
        fact: the same room number's type tag on the architect's sheet of the same id
        view: key_plan
    rule: >-
      The key plans are paired by their sheet id, not by their page number in the file. Each room
      number is then compared with the same room number on the architect's sheet, tag against tag.
    problem_when: a room's type tag differs from the architect's for the same room number.
    not_a_problem_when:
      - The tag differs only in wording for the same room type and the item code is the same.
    decided_by: code
    from: both
    source: >-
      Derived from the hand audits' miss lists: four key plans paired with the wrong architect
      sheet or not compared at all, with room-type tags differing on more than a dozen rooms.
    seen_as:
      created_by: [room_matrix, page_reviewer, whole_look, helper]
      words: ["room type", "room tag", "key plan", "room number", "connecting", "suite"]

  - key: detail_callout_ids
    asks: Does each detail callout on this key plan point at the same detail the architect points at?
    item_kinds: [key_plan]
    needs:
      - side: vendor
        fact: each callout's detail id and the room it sits on
        view: key_plan
      - side: architect
        fact: the same room's callout id on the architect's sheet of the same id
        view: key_plan
    rule: >-
      Callout ids are compared id against id for the same room. A callout the architect has added or
      moved since the vendor's issue is a change the vendor has not picked up.
    problem_when: a callout id differs, a callout sits on a different room, or the architect has a callout the vendor does not.
    not_a_problem_when:
      - The vendor's sheet uses a different leader style for the same id.
    decided_by: code
    from: misses
    source: >-
      Derived from the hand audits' miss lists: five detail callouts moved or renumbered between
      issues and flagged nowhere, on any key plan.
    seen_as:
      created_by: [room_matrix, page_reviewer, whole_look]
      words: ["callout", "detail id", "points at", "ID 6", "leader"]

  - key: item_counts_per_hand
    asks: Does the count of each item and each hand on the matrix match the counts on the item's own sheets?
    item_kinds: [key_plan]
    needs:
      - side: vendor
        fact: the per-item and per-hand counts on the matrix, and the per-floor and total rows
        view: matrix
      - side: vendor
        fact: the quantity printed on each item's own sheets
        view: the item's title block and room list
    rule: >-
      The matrix's count for an item and hand must equal that item's own quantity. The per-floor
      counts must add to the printed total.
    problem_when: a count differs from the item's own sheets, the two hands' counts are swapped, or the rows do not add to the total.
    not_a_problem_when:
      - The matrix counts sets and the item sheet counts pieces, and the note says so.
    decided_by: code
    from: misses
    source: >-
      Derived from the hand audits' miss lists (a matrix sheet swapping the left-hand and right-
      hand counts of two items).
    seen_as:
      created_by: [room_matrix, page_reviewer, whole_look]
      words: ["sets", "count", "matrix", "left:", "right:", "per floor", "sub total"]

  # --- cover, checklist and spec sheets ----------------------------------------------------------

  - key: spec_sheet_values_used
    asks: Do the sizes this set's spec sheets give match the sizes the item sheets used?
    item_kinds: [cover_sheet, sink_cutout_sheet, countertop_piece, vanity]
    needs:
      - side: vendor
        fact: the outside and inside sizes a maker's spec sheet gives for a sink or appliance
        view: spec_sheet
      - side: vendor
        fact: the same sizes as used or printed on the item sheets
        view: cutout_plan and stone_plan
    rule: >-
      A size printed on the set's own spec sheet is the size the item sheets must use. Where a spec
      sheet and an item sheet print the same size differently in inches, the inch values must still
      agree exactly.
    problem_when: an item sheet uses a size the spec sheet does not give, or the two print different inch values for the same size.
    not_a_problem_when:
      - The maker's own cut-out template differs from GV's cut-out rule; GV's rule decides the cut-out, and the template is a hint.
    decided_by: code
    from: both
    source: >-
      GV's settled rules, Countertop and sink (sink sizes come from the reviewer per project, or
      from the spec sheet); derived from real findings and the hand audits' miss lists.
    seen_as:
      created_by: [sink_sheets, page_reviewer, helper]
      words: ["spec sheet", "inside size", "reference only", "sink sheet", "cut sheet"]

  - key: set_notes_and_scope
    asks: What do this set's own notes say about scope and supply, and is anything on them wrong or missing?
    item_kinds: [cover_sheet]
    needs:
      - side: vendor
        fact: the set's general notes, scope notes and checklists
        view: notes
      - side: architect
        fact: the architect's scope and supply notes for the same work
        view: notes or schedule
    rule: >-
      The set's own notes carry the answers to who supplies what and what is excluded, for the whole
      set. A note that answers a question is checked once, at set level, not on every sheet.
    problem_when: a note contradicts the architect's scope, a note is misspelt in a way that changes its meaning, or a checklist or matrix sheet is empty.
    not_a_problem_when:
      - A single item sheet does not repeat a set-level supply note.
    decided_by: ai
    from: true_answers
    source: >-
      GV's product checklist; derived from real findings on the set's own notes and from the
      hand audits' miss lists (an empty matrix sheet).
    seen_as:
      created_by: [page_reviewer, whole_look]
      words: ["general notes", "scope", "by others", "exclusions", "checklist", "empty", "matrix sheet"]
