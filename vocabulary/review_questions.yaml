      own top sheet both have a single sink).
    seen_as:
      created_by: [page_reviewer, helper, whole_look]
      words: ["double bowl", "single bowl", "two bowls", "bowl"]

  - key: faucet_and_accessory_holes
    asks: How many holes are cut for the faucet and its accessories, what size are they, and where are they?
    item_kinds: [sink_cutout_sheet, countertop_piece, vanity]
    needs:
      - side: vendor
        fact: each hole's diameter and its distance from the cut-out and from the back edge
        view: cutout_plan
      - side: vendor
        fact: the same holes as printed on the item's other sheets
        view: stone_plan and the maker's spec sheet
      - side: architect
        fact: any fitting the architect draws on the top beside the sink
        view: plan
    rule: >-
      Every hole has a diameter and a position, and both must read the same on every sheet of the
      item and on the sink's own spec sheet.
    problem_when: a hole's size or position differs between two sheets of the item, a hole has no size, or the architect draws a fitting the vendor has not cut for.
    not_a_problem_when:
      - The architect prints no hole sizes; GV's check is then between the vendor's own sheets.
    decided_by: code
    compares: vendor_only
    from: both
    source: >-
      GV's product checklist, cut-outs; derived from 2 real findings and the hand audits' miss
      lists (a hole's size and position differing between two sheets of one top).
    seen_as:
      created_by: [sink_sheets, sink_offset, page_reviewer]
      words: ["faucet hole", "hole", "grommet", "air switch", "soap", "diameter"]

  - key: other_cutouts_and_holes
    asks: What other cut-outs or holes are in this top, and are they in the design?
    item_kinds: [sink_cutout_sheet, countertop_piece]
    needs:
      - side: vendor
        fact: each cooktop, waste or service hole, with its size and its position in the top
        view: stone_plan or cutout_plan
      - side: architect
        fact: the appliance or fitting the architect draws at that place
        view: plan or elevation
    rule: >-
      A cut-out the vendor adds that the architect does not draw is a scope difference and must be
      confirmed. A cut-out the architect draws that the vendor has not cut is a miss.
    problem_when: the vendor adds a cut-out the design does not have, or omits one the design does.
    not_a_problem_when:
      - The item's other sheets explain the cut-out and its fitting.
      - The architect draws the appliance but prints no cut-out size; there is then no size to compare.
    decided_by: ai
    from: both
    source: >-
      GV's product checklist, cut-outs; derived from real findings on cut-outs the vendor added
      that the design does not have.
    seen_as:
      created_by: [page_reviewer, whole_look, helper]
      words: ["cooktop cut", "waste hole", "hole in the top", "ring", "partial cutout", "not in the design"]

  # --- cabinet runs ---------------------------------------------------------------------------

  - key: run_wall_to_wall
    asks: How long is this run from wall to wall, and how long does the architect make it?
    item_kinds: [base_cabinet_run, upper_cabinet_run, vanity]
    needs:
      - side: vendor
        fact: the run's printed wall-to-wall overall
        view: plan
      - side: vendor
        fact: the same overall as printed on the elevation and in the title block
        view: elevation and title block
      - side: architect
        fact: the architect's wall-to-wall string for the same run, or its printed parts added up
        view: plan or elevation
    rule: >-
      The run's wall-to-wall length is compared with the architect's, in inches, exactly. Where the
      architect prints parts and no total, the parts are added. The site size governs: a difference
      is a site difference to be absorbed, not automatically an error, but it is always raised.
    problem_when: the vendor's wall-to-wall differs from the architect's, or from the vendor's own other views of the same run.
    not_a_problem_when:
      - The title block names the whole wall including an appliance opening while the run is only the cabinets; those are different spans.
    decided_by: code
    from: both
    source: >-
      Rulebook CAB-ARCH-VS-SHOP-001; derived from real findings and the hand audits' miss lists
      (an architect wall-to-wall string four inches from the vendor's run).
    seen_as:
      created_by: [page_reviewer, helper, whole_look, run_fit]
      rule_ids: [CAB-ARCH-VS-SHOP-001]
      words: ["wall to wall", "overall width", "run length", "overall run", "whole wall"]

  - key: cabinet_part_widths
    asks: How wide is each cabinet, drawer bank and panel in this run, and how wide is the architect's part in the same place?
    item_kinds: [base_cabinet_run, upper_cabinet_run, vanity]
    needs:
      - side: vendor
        fact: each part's printed width, in order along the run
        view: plan and elevation
      - side: architect
        fact: the architect's parts in the same order along the same run
        view: plan or elevation
      - side: gv_rule
        fact: the job's cabinet width limits for a single door, a double door and a drawer bank
        view: the job settings
    rule: >-
      Each part is matched to the architect's part at the same place along the run, and compared in
      inches, exactly. Cabinet width limits are mandatory job entries with no GV standard.
    problem_when: a part's width differs from the architect's part at the same place, or the parts are arranged differently.
    missing_fact_when: >-
      no cabinet width limits have been entered for the job.
    not_a_problem_when:
      - The run is mirrored; compare each part with its mirrored partner.
      - A vendor panel of one thickness stands where the architect draws a box side of another; that is a construction detail, raised once, not per bay.
      - The vendor's string holds a piece the architect does not draw; name what the piece is, usually a panel or a scribe, before calling it a difference.
    decided_by: code
    from: both
    source: >-
      GV's settled rules, Layouts and views (the elevation carries cabinet widths) and Cabinets
      and fillers (cabinet width limits are mandatory reviewer entries per project, with no
      company value); rulebook CAB-ARCH-VS-SHOP-001; derived from 18 real findings.
    seen_as:
      created_by: [page_reviewer, helper, whole_look, run_fit]
      rule_ids: [CAB-ARCH-VS-SHOP-001]
      words: ["cabinet width", "base cabinet", "bay width", "drawer base", "sink base", "upper", "open shelf"]

  - key: run_site_fit_share
    asks: When this run's size differs from the architect's, which pieces absorb the difference?
    item_kinds: [base_cabinet_run, upper_cabinet_run]
    needs:
      - side: vendor
        fact: the run's overall and each part's width and kind
        view: plan
      - side: architect
        fact: the architect's overall and each part's width
        view: plan or elevation
      - side: gv_rule
        fact: which part kinds are fixed and which are flexible
        view: the product registry
    rule: >-
      Fillers and drawer cabinets keep their design size. Door cabinets absorb the site difference
      equally between them. Equipment cabinets and appliance openings are never resized. A share that
      is not a whole sixteenth of an inch is not judged. The rule applies only when both sides' parts
      are real cabinets of the same run.
    problem_when: a door cabinet's width is not its architect width plus its equal share of the difference, or a fixed piece has been resized instead.
    not_a_problem_when:
      - A piece being compared is an appliance opening or a countertop length, not a door cabinet; the rule does not apply to it.
      - The two overalls are the same; there is no difference to share.
    decided_by: code
    compares: gv_rule
    from: rulebook
    source: >-
      GV's settled rules, Cabinets and fillers (2026-10-20: fillers and the drawer cabinet keep
      their design size and the door cabinets absorb the site difference equally; equipment
      cabinets are marked by the reviewer and never resized); rulebook CAB-FILLER-001.
    seen_as:
      created_by: [run_fit, filler_range]
      rule_ids: [CAB-FILLER-001]
      words: ["should be", "site difference", "absorb", "share", "door cabinet"]

  - key: cabinet_depth
    asks: How deep is the cabinet, carcass and door together?
    item_kinds: [base_cabinet_run, upper_cabinet_run, vanity]
    needs:
      - side: vendor
        fact: the carcass depth, the front thickness and the finished depth
        view: section
      - side: architect
        fact: the depth the architect prints for the same cabinet
        view: section or plan
      - side: gv_rule
        fact: the job's cabinet depth setting
        view: the job settings
    rule: >-
      Cabinet depth is the carcass depth plus the front's thickness, three quarters of an inch being
      typical. A section that measures to the box behind a fixed front panel has not reached the
      cabinet face.
    problem_when: the finished depth differs from the architect's, or it changes between two sections of the same run without reason.
    missing_fact_when: >-
      no cabinet depth has been entered for the job.
    not_a_problem_when:
      - One section measures to the carcass and another to the front face; add the front before comparing.
      - The section is cut through an appliance column, so there is no cabinet to measure.
    decided_by: code
    from: both
    source: >-
      GV's settled rules, Countertop and sink (cabinet depth = carcass depth + door thickness,
      three quarters of an inch typical); derived from real findings on a top depth that steps
      along one run.
    seen_as:
      created_by: [page_reviewer, helper, whole_look]
      words: ["cabinet depth", "carcass", "box depth", "deep"]

  - key: run_overall_height
    asks: How high is this run overall, and do the height strings add up to it?
    item_kinds: [base_cabinet_run, upper_cabinet_run, vanity]
    needs:
      - side: vendor
        fact: every part in each height string, and the printed overall height
        view: elevation and section
      - side: architect
        fact: the architect's overall height for the same run
        view: elevation
    rule: >-
      Each height string's parts must add to the printed overall, in inches. Where a sheet prints no
      overall but a complete string on the same sheet adds up to a height printed in a section of the
      same item, the overall is given.
    problem_when: a height string does not add up, or the overall differs from the architect's.
    not_a_problem_when:
      - No overall is printed in the elevation but the sheet's own strings add up to the height a section of the same item prints; the height is not missing.
      - A part height is mistaken for the tallest dimension; a part is not an overall.
    decided_by: code
    compares: vendor_only
    from: true_answers
    source: >-
      GV's product checklist; derived from 3 real findings in the heights topic, and from the
      false-alarm ledger, where 6 false alarms said there was no overall height when the sheet's
      own strings added up to it.
    seen_as:
      created_by: [page_reviewer, helper, whole_look, consistency]
      words: ["overall height", "height string", "no overall", "tallest", "84", "add to"]

  - key: toe_kick
    asks: How high is the toe kick, and what finish does it carry?
    item_kinds: [base_cabinet_run, vanity]
    needs:
      - side: vendor
        fact: the toe-kick height and its finish tag
        view: elevation and section
      - side: architect
        fact: the toe-kick height and finish the architect gives
        view: elevation or section
    rule: >-
      The toe-kick height and its finish code are compared with the architect's, in inches and by
      code, exactly.
    problem_when: the height or the finish code differs from the architect's.
    not_a_problem_when:
      - The architect gives a height but no finish, or the other way round; only what is given is compared.
    decided_by: code
    from: true_answers
    source: >-
      GV's product checklist; derived from 2 real findings.
    seen_as:
      created_by: [page_reviewer, helper, whole_look]
      words: ["toe kick", "toe-kick", "toe"]

  - key: fronts_and_bays
    asks: >-
      What is in each bay of this run: doors, drawers, open shelves, a removable panel or an
      appliance?
    item_kinds: [base_cabinet_run, upper_cabinet_run, vanity]
    needs:
      - side: vendor
        fact: what each bay holds, bay by bay along the run
        view: elevation
      - side: architect
        fact: what the architect puts in each bay of the same run
        view: elevation
    rule: >-
      The arrangement is compared bay by bay along the run: the number of doors, drawers and open
      bays and what each one holds. A removable or false front is compared with the architect's
      removable or false front, not with a drawer.
    problem_when: a bay holds something different from the architect's bay at the same place, or the counts of doors, drawers or open bays differ.
    not_a_problem_when:
      - The vendor's open boxes with lights are the architect's open shelves; a box without doors is an open shelf.
      - The count differs only because a bay at one end has been counted twice or missed; count from the same datum on both.
      - The layout is the mirror of the architect's one typical room.
    decided_by: ai
    from: true_answers
    source: >-
      GV's product checklist; derived from real findings on drawers drawn as open cubbies and a
      hinged door where a removable panel was called for.
    seen_as:
      created_by: [page_reviewer, whole_look, helper]
      words: ["doors", "drawers", "open shelf", "bays", "fronts", "false front", "removable panel", "cubby"]

  - key: finish_tags_on_fronts
    asks: What finish code does each front, panel and back carry, and what does the architect call for there?
    item_kinds: [base_cabinet_run, upper_cabinet_run, vanity, accessory_detail]
    needs:
      - side: vendor
        fact: the finish code on each front, panel, toe and back
        view: elevation
      - side: architect
        fact: the architect's finish code at the same place
        view: elevation or finish schedule
    rule: >-
      Finish codes are compared code against code. A vendor code that is the architect's code with a
      suffix added is the same finish. A code that is a different number is a different finish.
    problem_when: a surface carries a different finish code from the architect's at the same place, or carries none at all.
    not_a_problem_when:
      - The vendor's code is the architect's code with a suffix; that is the same finish.
      - A section does not repeat a tag that the item's elevation already carries.
      - Every exposed face is finished and only the words "finish exposed faces" are missing.
      - The architect's set carries item codes but no finish schedule; an item code is not a finish code.
    decided_by: ai
    from: true_answers
    source: >-
      GV's settled rules, Layouts and views (the elevation carries the tags); derived from a
      real finding on a toe-kick finish code, and from the false-alarm ledger, where 6 of 6
      answers calling a suffixed code a difference were wrong.
    seen_as:
      created_by: [page_reviewer, whole_look, helper]
      words: ["finish tag", "finish code", "front finish", "laminate", "veneer", "grain"]

  - key: hardware
    asks: What pulls, hinges, legs and brackets does this item use, and what does the architect call for?
    item_kinds: [base_cabinet_run, upper_cabinet_run, vanity, accessory_detail]
    needs:
      - side: vendor
        fact: the pull type and size, the hinge type, the leg or bracket type and size
        view: elevation, section and detail
      - side: architect
        fact: the hardware the architect specifies
        view: elevation, detail or schedule
    rule: >-
      Hardware is compared only where the architect specifies it: the type, the material and the size.
      A routed pull in place of a fitted pull, or a square tube in place of a round leg, is a design
      difference.
    problem_when: the hardware type, material or size differs from the architect's.
    not_a_problem_when:
      - The architect gives no hardware for this item; there is nothing to compare.
    decided_by: ai
    from: true_answers
    source: >-
      GV's product checklist; derived from 3 real findings.
    seen_as:
      created_by: [page_reviewer, whole_look, helper]
      words: ["pull", "hinge", "leg", "bracket", "hardware", "knob"]

  - key: knee_space_kept_open
    asks: Where the design leaves a knee space open, is it still open?
    item_kinds: [base_cabinet_run, vanity]
    needs:
      - side: vendor
        fact: what fills the span the architect leaves open, and its width
        view: plan and elevation
      - side: architect
        fact: the open span's width and the note that calls for it to stay open
        view: plan or elevation
    rule: >-
      A span the architect marks open for approach must stay open. Splitting it into bays, or filling
      it with a drawer bank or fixed panels, is a design difference even when the total width matches.
    problem_when: the open span is split, filled or narrowed.
    not_a_problem_when:
      - The panels are removable and the architect also calls for removable panels.
    decided_by: ai
    from: true_answers
    source: >-
      GV's product checklist; derived from real findings on an open approach space split into
      bays and filled with a drawer bank.
    seen_as:
      created_by: [page_reviewer, whole_look, helper]
      words: ["knee space", "open for", "forward approach", "open bay", "clear space"]

  - key: appliance_openings_sized
    asks: How wide is each appliance opening, and what width does the architect hold for it?
    item_kinds: [appliance_opening, base_cabinet_run]
    needs:
      - side: vendor
        fact: each opening's printed width, and which appliance it is for
        view: plan and elevation
      - side: architect
        fact: the architect's opening width, plus any side gap the architect's notes hold beside it
        view: plan, elevation or notes
    rule: >-
      An opening is compared with the architect's opening plus any gap the architect's notes hold
      beside it; both are part of the space the appliance needs. An opening is not a cabinet: it has
      no carcass and needs no filler of its own.
    problem_when: the opening is narrower or wider than the architect holds for it, including the gap.
    not_a_problem_when:
      - The opening at a wall end has no filler; an opening needs none.
      - The opening is treated as a door cabinet in a site-fit sum; it is not one.
      - The appliance still fits; the printed opening is still compared, but the gap is explained.
    decided_by: code
    from: true_answers
    source: >-
      Derived from 1 real finding, and from the false-alarm ledger, where 6 false alarms treated
      an appliance opening as a cabinet missing its filler or as a door cabinet in a site-fit
      sum.
    seen_as:
      created_by: [page_reviewer, helper, whole_look, run_fit]
      words: ["refrigerator", "fridge", "range", "dishwasher", "microwave", "cooktop", "opening", "appliance space"]

  - key: lighting_and_outlets
    asks: What lighting and electrical does this item carry, and does it match the design and the item's other sheets?
    item_kinds: [base_cabinet_run, upper_cabinet_run, accessory_detail, countertop_piece]
    needs:
      - side: vendor
        fact: strip and puck light lengths and positions, and any outlet or service cut-out
        view: elevation, plan and the set's lighting layout
      - side: architect
        fact: the lights and outlets the architect draws, with their heights and positions
        view: elevation or reflected ceiling plan
    rule: >-
      A light's length is compared with the bay it sits in and with the length the set's own lighting
      layout gives it. An outlet or service position is compared with the architect's where the
      architect prints one.
    problem_when: a light length differs between the lighting layout and the item's own sheets, or the architect's outlets have no access in the vendor's cabinets.
    not_a_problem_when:
      - Outlets are the general contractor's work and marked for reference only; the position is still raised but as a confirm.
    decided_by: ai
    from: both
    source: >-
      GV's product checklist; derived from 3 real findings and the hand audits' miss lists
      (architect outlets inside the base cabinets with no access drawn).
    seen_as:
      created_by: [page_reviewer, whole_look, helper]
      words: ["LED", "strip light", "puck", "outlet", "GFI", "electrical", "lighting"]

  # --- fillers --------------------------------------------------------------------------------

  - key: filler_width
    asks: How wide is each filler, and how wide is the architect's filler in the same place?
    item_kinds: [filler, base_cabinet_run, upper_cabinet_run]
    needs:
      - side: vendor
        fact: each filler's printed width
        view: plan and elevation
      - side: architect
        fact: the architect's filler or scribe at the same place
        view: plan or elevation
      - side: gv_rule
        fact: GV's filler range, one inch to two inches, changeable per project
        view: the job settings
    rule: >-
      A filler is red only when it differs from the architect's design filler. GV's one-inch to
      two-inch range is a note only and is never a red on its own: GV has accepted wider fillers, and
      the architect governs. Where the vendor prints the architect's own filler size and that size is
      outside GV's range, the item is not compared and needs GV's own call.
    problem_when: the filler differs from the architect's filler at the same place.
    not_a_problem_when:
      - The filler is outside GV's one-to-two-inch range but matches the architect; that is a note, never a red.
      - A note calls for oversize filler stock to be field cut on site; that is site stock, not a design size.
      - The filler is paired with a box side or panel on the architect's drawing; those are different pieces.
    decided_by: code
    compares: architect
    from: true_answers
    source: >-
      GV's settled rules, Cabinets and fillers (fillers min 1 inch, max 2 inches, changeable per
      project; 2026-10-20 the range is a GV NOTE only and never a red, a filler being red only
      when it differs from the architect's design filler; 2026-10-21 an architect filler outside
      the range is Not compared and needs GV's own call); rulebook CAB-FILLER-001.
    seen_as:
      created_by: [filler_range, filler_facts, page_reviewer, helper]
      rule_ids: [CAB-FILLER-001]
      words: ["filler", "scribe", "filler width", "field cut filler"]

  - key: filler_at_each_wall_end
    asks: Does every end of this run that meets a wall have a filler or scribe?
    item_kinds: [filler, base_cabinet_run, upper_cabinet_run]
    needs:
      - side: vendor
        fact: what sits at each end of the run, and whether that end meets a wall
        view: plan and elevation
      - side: architect
        fact: the scribe or filler the architect draws at the same end
        view: plan or elevation
    rule: >-
      A cabinet that meets a wall needs a filler or a scribe so it can be fitted on site. An appliance
      opening at a wall needs none.
    problem_when: a cabinet meets a wall with nothing to scribe to.
    not_a_problem_when:
      - The end at the wall is an appliance opening.
      - The end piece is wide enough to be a cabinet rather than a filler; judge it as a cabinet.
      - The filler is drawn and dimensioned but its label sits outside the overall's extension lines.
    decided_by: ai
    from: true_answers
    source: >-
      GV's settled rules, Cabinets and fillers; derived from a real finding on a cabinet meeting
      a wall with nothing to scribe to, and from the false-alarm ledger, where 13 false alarms
      came from the filler conventions.
    seen_as:
      created_by: [filler_facts, filler_range, page_reviewer, helper]
      words: ["no filler", "filler at the wall", "wall end", "scribe at", "nothing to scribe"]

  # --- vanity and support ----------------------------------------------------------------------

  - key: clear_width_at_an_accessible_item
    asks: How much clear width and clear space below does this accessible item leave?
    item_kinds: [vanity, base_cabinet_run]
    needs:
      - side: vendor
        fact: the clear width between walls or partitions and the clear height under the item
        view: plan, elevation and section
      - side: architect
        fact: the clear dimension the architect prints for the same item
        view: plan or section
    rule: >-
      A clear dimension is compared only with another clear dimension. A clear width printed by the
      architect is the space that must be left, not the size of the piece that sits in it.
    problem_when: the clear width or the clear height below is less than the architect's.
    not_a_problem_when:
      - The architect's clear width and the vendor's piece length are compared directly; the piece may be longer where it runs into the wall pockets.
      - The item is a standard one, not an accessible one.
    decided_by: code
    from: rulebook
    source: >-
      GV's product checklist; GV's settled rules defer ADA judgements to later, so this asks
      only what the architect prints and compares clear against clear.
    seen_as:
      created_by: [page_reviewer, helper, whole_look]
      words: ["clear", "accessible", "ADA", "knee clearance", "clear width"]

  - key: support_frame_or_legs
    asks: What holds this item up, and are the support's own sizes right?
    item_kinds: [vanity, accessory_detail, countertop_piece]
    needs:
      - side: vendor
        fact: the frame, leg or bracket sizes, their spacing and the height to the underside
        view: detail, elevation and section
      - side: architect
        fact: the support the architect calls for, with its material, shape and size
        view: elevation, section or detail
    rule: >-
      The support's own dimension strings must add up, and its type, material and size are compared
      with the architect's where the architect specifies them.
    problem_when: the support's strings do not add up, or the support's type, material, size or height differs from the architect's.
    not_a_problem_when:
      - The architect shows a support but specifies nothing about it.
    decided_by: code
    compares: vendor_only
    from: true_answers
    source: >-
      GV's product checklist; derived from real findings on a support frame's own dimension
      strings and on legs that differ from the architect's in shape and size.
    seen_as:
      created_by: [page_reviewer, helper, whole_look]
      words: ["frame", "leg", "glide", "bracket", "support", "underside", "metal frame"]

