# GV Review's fixed question list, and the kinds of item the questions are asked about.
#
# Why this file exists: every finding in GV Review is made by an AI, and code only does arithmetic
# on numbers the AI already wrote down. A problem the AI never notices is invisible to the whole
# system. Asking an open question ("what looks wrong on this page?") gives a different answer every
# run and carries no GV knowledge. A fixed question ("what is this top's finished depth, and what
# does the architect give for it?") is answered the same way every run, and the question itself
# carries the settled rule that governs the answer and the mistakes not to make.
#
# This file is generic millwork review knowledge. It holds no client, project or drawing names, and
# no numbers taken from a client's drawing. Every rule in it is either GV's own company standard or
# something settled with the client and recorded as settled; nothing here was invented.
#
# How to read one question:
#   key               a short stable name; code and reports use it, it never changes
#   asks              the question in plain English, as a person would ask it
#   item_kinds        which kinds of item it is asked about ("*" means every kind)
#   needs             the facts the answer needs: which side they come from, and the view that
#                     normally carries each one
#   rule              the settled rule that decides the answer, written so it cannot be read two ways
#   problem_when      what makes the answer a problem
#   missing_fact_when   when the question's governing value is a job setting, what absence looks
#                     like. A missing job value is reported as a missing fact, never as a defect
#                     and never as a silent pass.
#   not_a_problem_when  the things that look like a problem and are not (the anti-patterns)
#   decided_by        "code" = code can prove it from numbers, so it can go red
#                     "ai"   = only a person or the AI can judge it; it is always a please-check
#   compares          what the answer is weighed against: "vendor_only" (the vendor's own sheets
#                     answer it, no architect needed), "gv_rule" (a GV standard or job setting
#                     decides it), or "architect" (it is weighed against the architect's drawing).
#                     Left out, it is worked out from the facts the question needs.
#   from              where the question came from: "true_answers" (a run found a real problem by
#                     asking it), "misses" (a hand audit found a real problem nobody asked about),
#                     "both", or "rulebook" (GV's own checklist or published rulebook)
#   source            one line naming exactly where the rule comes from: which section of GV's
#                     settled rules, which rulebook id, which checklist, and how many real findings
#                     it is derived from. It is there so the next person can audit this list
#                     without redoing the work that built it.
#   seen_as           measurement only: how an answer to this question looks in the old open-ended
#                     runs, so coverage can be measured on saved runs. Not part of the question.
#
# Two things measured over 683 audited answers shape the whole list, and are written into it:
#
# 1. **What the question is weighed against predicts its quality far better than who asks it.**
#    "Do this sheet's own parts add up to its own overall?" was right 98.6% of the time over 73
#    audited answers on three jobs. Anything weighed against the architect was right 67% of the time
#    and produced almost all of the noise. So the vendor-only and GV-rule questions come first, and
#    the architect ones carry the longest rule text and the most anti-patterns; none of them is
#    asked until the architect view has been settled (see `architect_view_for_this_item`).
#
# 2. **The unit of review is the item's sheet set, not the page.** Nearly a quarter of all false
#    alarms were one sheet being asked for what another sheet of the same item already shows. Every
#    question is answered from the item's whole sheet set; a fact printed on the item's first sheet
#    closes the question for every later sheet of that item.

schema: gv-review-questions/1

# ---------------------------------------------------------------------------------------------
# The item taxonomy: the kinds of thing GV reviews, and the views that carry their facts.
# ---------------------------------------------------------------------------------------------
item_kinds:
  - key: countertop_piece
    label: Countertop piece
    what: >-
      One piece of stone or quartz top, with its overhang, edges and splashes. A run split by a
      range or a corner is more than one piece.
    views:
      stone_plan: the top drawn on its own sheet, with its overall sizes, cut-outs and edge marks
      cabinet_plan: the same top drawn over the cabinet run, with the run's wall-to-wall string
      section: the top's thickness, overhang and counter height
      elevation: the splash height and the top's edge seen end-on

  - key: sink_cutout_sheet
    label: Sink or appliance cut-out sheet
    what: >-
      A sheet drawn for one sink, cooktop or waste hole, giving the cut-out's size, its offsets and
      its holes. One cut-out sheet often serves several tops.
    views:
      cutout_plan: the cut-out's width, depth, front and back offsets and hole positions
      section: the cut depth and any rebate
      spec_sheet: the maker's sheet for the sink or appliance, with its outside and inside sizes

  - key: base_cabinet_run
    label: Base cabinet run
    what: >-
      The row of base cabinets, drawer banks, fillers and appliance openings along one wall, under
      one countertop.
    views:
      plan: the run's wall-to-wall string and each part's width
      elevation: the same widths, the toe kick, the fronts and their finish tags
      section: the cabinet depth, the counter height and the box build-up

  - key: upper_cabinet_run
    label: Upper cabinet run
    what: >-
      The row of wall cabinets, open shelf bays, microwave bay and panels above a counter.
    views:
      elevation: the bay widths, the heights and the fronts
      wall_plan: the same widths seen from above, with the cut-outs in the top below
      section: the box height and depth

  - key: vanity
    label: Vanity
    what: >-
      A bathroom vanity: its top, its cabinet or steel frame, its sink and its splashes, usually one
      item on one or two sheets.
    views:
      plan: the top's width and depth, the cut-out's position
      elevation: the overall height, the fronts, the open shelf and the legs
      section: the counter height, the top thickness, the frame and the clear space below

  - key: filler
    label: Filler or scribe
    what: >-
      A narrow piece that closes the gap between a cabinet and a wall, or between two units. It is
      a part of a run, not a cabinet.
    views:
      plan: its width inside the run's string
      elevation: its width and its finish tag

  - key: splash
    label: Splash
    what: >-
      A back splash along the wall behind a top, or a side splash against a wall at one end.
    views:
      stone_plan: its length and which end it is at
      elevation: its height above the top
      section: its thickness and whether it is mitred or set on

  - key: accessory_detail
    label: Accessory detail
    what: >-
      A hook rail, floating shelf, cup-hook shelf, rod, bracket, leg or metal support frame drawn as
      its own detail.
    views:
      detail: its overall size and its parts
      elevation: where it sits and how high
      section: how it is fixed

  - key: appliance_opening
    label: Appliance opening
    what: >-
      The space left for a refrigerator, range, cooktop, dishwasher or microwave. It is an opening,
      not a cabinet: it has no carcass and no filler of its own.
    views:
      plan: the opening's width and the gap held beside it
      elevation: the opening's height and the appliance tag

  - key: key_plan
    label: Key plan or room matrix
    what: >-
      A floor plan or table that says which item goes in which room, with the room-type tags, the
      detail callouts and the counts.
    views:
      key_plan: the room numbers, their type tags and the detail callouts
      matrix: the per-floor and total counts for each item and hand

  - key: cover_sheet
    label: Cover, checklist or spec sheet
    what: >-
      A sheet that carries no item of its own: the cover, the general notes, a checklist, a material
      board, a lighting layout or a maker's spec sheet.
    views:
      notes: the set-wide notes and who supplies what
      board: the finish and stone swatches
      spec_sheet: a sink's or appliance's own sizes

# ---------------------------------------------------------------------------------------------
# The questions.
# ---------------------------------------------------------------------------------------------
questions:

  # --- asked about every item -----------------------------------------------------------------

  - key: string_adds_up
    asks: Do the printed parts of each dimension string add up to the printed overall of that string?
    item_kinds: ["*"]
    needs:
      - side: vendor
        fact: every part of one dimension string, in inches
        view: any view that carries a dimension string
      - side: vendor
        fact: the printed overall of that same string
        view: the same view
    rule: >-
      Inches are compared exactly and millimetres are ignored. Parts and overall belong to the same
      string only when their outer ends land on the same extension lines. The inch figures must add
      up even when the millimetres do: a part printed one sixteenth too large is still wrong.
    problem_when: the inch parts do not add up to the inch overall.
    not_a_problem_when:
      - A part lies outside the overall's extension lines; it belongs to a neighbouring string.
      - The millimetres add up but the inches do not; that is still a problem, because inches count.
      - A label is printed outside a narrow gap; where the text sits does not move the dimension.
      - A string could not be read well enough to add up; that is a reading gap to report as a gap, never a difference.
    decided_by: code
    compares: vendor_only
    from: both
    source: >-
      GV's settled rules, Units and matching (inches count, millimetres are ignored, exact
      match); derived from 71 real findings across three audited jobs, the highest-yield
      question in the product.
    seen_as:
      created_by: [string_check, consistency, vendor_arithmetic, page_reviewer]
      words: ["add up", "adds to", "string", "parts sum", "overall", "does not add"]

  - key: inch_labels_match_the_millimetres
    asks: Does every millimetre value carry the same, correct inch figure everywhere it appears?
    item_kinds: ["*"]
    needs:
      - side: vendor
        fact: each dimension printed as a millimetre value with an inch figure beside it
        view: any view, detail or note
      - side: vendor
        fact: the same millimetre value where it appears again, on this sheet or another sheet of the item
        view: the item's other views and sheets
    rule: >-
      The vendor designs in millimetres and prints an inch figure beside each one. One millimetre
      value has one right inch figure, and it must be the same figure every time that value appears.
      Inches are what GV compares, so a wrong or inconsistent inch figure is a difference even when
      the millimetres are right.
    problem_when: one millimetre value is printed with two different inch figures, or an inch figure is not the right conversion of its millimetre value.
    not_a_problem_when:
      - A value is deliberately repeated above and below one view with the same figure.
    decided_by: code
    compares: vendor_only
    from: misses
    source: >-
      GV's settled rules, Units and matching; derived from the hand audits' miss lists (one
      millimetre value printed with two different inch figures, on four sheets).
    seen_as:
      created_by: [page_reviewer, consistency, helper]
      words: ["printed as", "rounded", "conversion", "millimetre", "mm", "both", "label slip", "[0]"]

  - key: parts_have_an_inch_figure
    asks: Does every part of a dimension string carry an inch figure at all?
    item_kinds: ["*"]
    needs:
      - side: vendor
        fact: each part of each dimension string, and whether it prints an inch figure
        view: any view, detail or note
    rule: >-
      GV compares inches. A part printed in millimetres only, or printed as zero inches when the
      piece plainly has a size, cannot be checked, and the honest answer is that it cannot be
      checked, not that it agrees.
    problem_when: a part of a string has no inch figure, or prints zero inches for a piece that has a size.
    not_a_problem_when:
      - The whole sheet is drawn in inches alone; there is nothing to convert.
    decided_by: code
    compares: vendor_only
    from: misses
    source: >-
      GV's settled rules, Units and matching; derived from the hand audits' miss lists (details
      printed in millimetres only, and parts printed as zero inches).
    seen_as:
      created_by: [page_reviewer, consistency, helper]
      words: ["mm only", "no inch", "[0]", "zero", "cannot be checked", "not readable in inches"]

  - key: same_value_across_sheets
    asks: Does every sheet that draws this item print the same value for the same dimension?
    item_kinds: ["*"]
    needs:
      - side: vendor
        fact: one dimension of the item, as printed on its own sheet
        view: any view on the item's sheet set
      - side: vendor
        fact: the same dimension as printed on the item's other sheets
        view: the item's other sheets
    rule: >-
      A dimension that names the same two ends of the same item must read the same on every sheet of
      that item, in inches, exactly. This covers a top's length on its stone sheet against the
      cabinet plan, a cut-out size on the cut-out sheet against the top sheet, and a cabinet width
      printed on both the plan and the elevation.
    problem_when: two sheets of the same item print different inch values for the same dimension.
    not_a_problem_when:
      - The two values measure different spans; a run's length and a top's length are not the same span.
      - One sheet shows the piece and the other shows the opening it sits in.
    decided_by: code
    from: both
    source: >-
      GV's practice of reviewing an item by its whole sheet set; derived from 2 real findings
      and the largest single family in the hand audits' miss lists.
    seen_as:
      created_by: [sink_sheets, page_reviewer, whole_look]
      words: ["against the sheet", "on another sheet", "its own sheet", "two sheets", "disagree", "cross-sheet"]

  - key: mirror_twin_sizes
    asks: Where an item is made in a left hand and a right hand, do the two hands carry the same sizes?
    item_kinds: ["*"]
    needs:
      - side: vendor
        fact: each dimension of the left-hand item
        view: the left-hand sheets
      - side: vendor
        fact: the same dimension of the right-hand item
        view: the right-hand sheets
    rule: >-
      A mirrored pair is the same item made both ways round. Every size must match between the two
      hands; only the side a feature sits on changes.
    problem_when: the two hands print different sizes for the same part, or the two hands' counts are swapped.
    not_a_problem_when:
      - The layout is mirrored. A mirrored room is intended and is never itself a difference.
      - A feature is on the opposite side in the opposite hand; that is what a mirror is.
    decided_by: code
    from: misses
    source: >-
      GV's practice; derived from the hand audits' miss lists (two hands of one item printing
      different sizes on identical cabinets, and swapped per-hand counts).
    seen_as:
      created_by: [page_reviewer, whole_look]
      words: ["opposite hand", "twin", "mirror", "left hand", "right hand", "L/R"]

  - key: architect_view_for_this_item
    asks: Which architect view is this item's design, and what makes it certain it is this item and not a look-alike?
    item_kinds: ["*"]
    needs:
      - side: vendor
        fact: the item's code, its room list and its wall-to-wall size
        view: the title block and the plan
      - side: architect
        fact: the candidate view's own item tag, room type, overall size and hand
        view: the architect plan, elevation or detail
    rule: >-
      An item is paired with an architect view only when something names it: the architect printing
      the same item tag, the same room number, the same room type, or the same wall-to-wall size.
      A view that merely looks like it is not a pair. Where no view names the item, the honest answer
      is that there is nothing to compare, not a guess.
    problem_when: no architect view can be named for an item the architect clearly draws, or the chosen view belongs to another room, another hand, another brand or another sheet of the set.
    not_a_problem_when:
      - One architect view legitimately serves several items; a cut-out sheet used by two kitchens pairs with both.
      - The architect genuinely draws nothing for this item; that is "nothing to compare", not a miss.
    decided_by: ai
    from: misses
    source: >-
      Derived from the false-alarm ledger: 37 of 164 false alarms came from the wrong architect
      view, the largest mechanical cause of all.
    seen_as:
      created_by: [pairing, lead, whole_look]
      words: ["best guess", "architect page", "no architect drawing", "paired", "wrong page", "no sheet"]

  - key: title_block_complete
    asks: Is the title block filled in, and does every cell in it agree with the views on the sheet?
    item_kinds: ["*"]
    needs:
      - side: vendor
        fact: the item number, description, overall size, thickness, colour, quantity, page and date cells
        view: the title block
      - side: vendor
        fact: the overall sizes drawn in the views on the same sheet
        view: plan and elevation
    rule: >-
      Every cell the vendor's own template carries is either filled or deliberately blank, and a
      filled cell must agree with what the views draw. An overall size cell that disagrees with the
      drawn overall is a difference like any other.
    problem_when: a cell is blank on a sheet that carries an item, or a filled cell disagrees with the drawn value.
    not_a_problem_when:
      - A cell is blank on a shared template sheet that serves several items, such as a cut-out sheet tied to its tops by the sink model.
      - The stone sheet and the cabinet sheet of one item share one item number; neither is missing its own.
    decided_by: ai
    from: true_answers
    source: >-
      GV's product checklist; derived from 10 real findings in the title-block topic.
    seen_as:
      created_by: [page_reviewer]
      words: ["title block", "item no", "item number cell", "overall size", "blank", "quantity cell", "colour cell"]

  - key: item_number_matches_architect_tag
    asks: Is the item number on the sheet the tag the architect uses for this item?
    item_kinds: ["*"]
    needs:
      - side: vendor
        fact: the item code printed on the sheet and in the title block
        view: the title block and the sheet heading
      - side: architect
        fact: the tag the architect prints on this item in the room
        view: the architect plan or elevation
    rule: >-
      The vendor's item code must be the architect's tag for the same item. A suffix the architect
      uses to separate the top from the cabinet (a trailing letter on the same code) is the same
      item, not a different one.
    problem_when: the vendor uses a code the architect gives to a different item, or the two codes name different rooms.
    not_a_problem_when:
      - The architect's code has a suffix for the stone and the vendor's does not; that is naming, not a different item.
      - Two sheets of one item share one item number.
    decided_by: code
    from: both
    source: >-
      GV's product checklist; derived from 10 real findings in the title-block topic, two of
      them an item code that names another item on the architect's plan.
    seen_as:
      created_by: [page_reviewer, helper, whole_look]
      words: ["item number", "item code", "tag", "named", "called"]

  - key: sheet_revision_and_date
    asks: Was this sheet drawn against the architect's current revision?
    item_kinds: ["*"]
    needs:
      - side: vendor
        fact: the sheet's date and revision
        view: the title block
      - side: architect
        fact: the set's issue date and revision, and whether this item sits inside a revision cloud
        view: the architect sheet's title block and the clouded area
    rule: >-
      A vendor sheet dated before the architect's current revision, for an item that sits inside that
      revision's cloud, is drawn against superseded information and must be confirmed.
    problem_when: the vendor sheet predates a revision that clouds this item.
    not_a_problem_when:
      - The dates differ but the item is outside every revision cloud.
      - The whole vendor set carries one issue date; that alone is not a defect.
    decided_by: ai
    from: both
    source: >-
      GV's product checklist; derived from 1 real finding and the hand audits' miss lists
      (sheets inside a revision cloud never flagged).
    seen_as:
      created_by: [page_reviewer, whole_look]
      words: ["date", "revision", "rev 2", "cloud", "issued", "superseded"]

  - key: view_titles_and_sheet_numbering
    asks: Does each view have its own correct title, and are the sheets of this item numbered right?
    item_kinds: ["*"]
    needs:
      - side: vendor
        fact: every view title on the sheet and the cut markers they answer
        view: all views on the sheet
      - side: vendor
        fact: the sheet-of-sheets numbering across the item's sheets
        view: the title block
    rule: >-
      Each cut marker on a plan or elevation is answered by exactly one view with that letter or
      number, and each sheet of an item carries its own place in the set.
    problem_when: two views share one title, a view title is misspelt, or two sheets of one item carry the same sheet-of number.
    not_a_problem_when:
      - A view appears on a later sheet than its cut marker; sections on a second sheet are normal.
    decided_by: ai
    from: both
    source: >-
      GV's product checklist; derived from 11 real findings and the hand audits' miss lists (an
      item's four sheets numbered 3 of 3 twice).
    seen_as:
      created_by: [page_reviewer]
      words: ["view title", "both titled", "same title", "section", "sheet number", "misspelt", "typo"]

  - key: material_table_covers_the_tags
    asks: Is every finish, metal and stone tag used on this item's sheets defined in the item's material table, and is every row in the table used?
    item_kinds: ["*"]
    needs:
      - side: vendor
        fact: every finish or material tag used in any view of the item
        view: plan, elevation, section and detail
      - side: vendor
        fact: the material table on the item's sheet set
        view: the sheet that carries the table, usually the first sheet of the item
    rule: >-
      Asked once per item, over the item's whole sheet set, never per view. A tag defined on the
      item's first sheet covers every later sheet of that item. Across four audited runs this topic
      produced 57 answers and no first-time real problem: 31 were trivial repeats and 14 were wrong,
      every one of them a view being asked to repeat what a sibling sheet already carried.
    problem_when: a tag is used in a view and defined nowhere on the item's sheets, or a row in the table is never used.
    not_a_problem_when:
      - The tag is defined on another sheet of the same item.
      - A view does not repeat a tag that the item's elevation already carries; views need not repeat each other.
      - The sheet is GV's own stone sheet and names the stone in its own specification cell.
      - The architect's set carries item codes but no finish or material schedule; an item code is not a finish code, so there is nothing to compare.
    decided_by: ai
    compares: vendor_only
    from: rulebook
    source: >-
      GV's product checklist; 57 audited answers produced no first-time real problem (31
      trivial, 14 false), which is why the rule limits it to once per item.
    seen_as:
      created_by: [page_reviewer, whole_look]
      words: ["material table", "no tag", "not in the table", "untagged", "swatch", "legend", "finish tag", "stone tag"]

  - key: quantity_and_room_list_agree
    asks: Does the quantity box agree with the room list printed on the item's own sheets?
    item_kinds: ["*"]
    needs:
      - side: vendor
        fact: the quantity in the title block
        view: the title block
      - side: vendor
        fact: the room list or total note on the item's sheets
        view: the notes on the item's sheets
    rule: >-
      The quantity, the number of rooms listed and the printed total must be the same number on every
      sheet of the item. The same holds for a part's own quantity note: a note calling for a number
      of fillers or panels must match the parts the views draw.
    problem_when: the quantity box, the room list and the printed total do not agree, or a part-quantity note calls for parts the views do not draw.
    not_a_problem_when:
      - The item's two hands have separate quantities; each is counted against its own room list.
    decided_by: code
    from: both
    source: >-
      GV's product checklist; derived from 2 real findings and the hand audits' miss lists (room
      lists clashing between an item's own sheets).
    seen_as:
      created_by: [page_reviewer]
      words: ["quantity", "qty", "room list", "total qty", "rooms", "sets"]

  - key: legible_text_and_values
    asks: Is every dimension and note on this sheet readable, and does every value carry a real number?
    item_kinds: ["*"]
    needs:
      - side: vendor
        fact: dimension texts, notes and callouts, including ones that overlap
        view: all views on the sheet
    rule: >-
      A value that reads as a question mark, as "TBD", or as zero inches when the piece clearly has a
      size, is not a value. Text printed over text that cannot be separated is not a value either.
    problem_when: a dimension or note cannot be read, or carries a placeholder instead of a size.
    not_a_problem_when:
      - Two labels overlap but both can still be read.
      - A dimension is deliberately repeated above and below a view.
    decided_by: ai
    from: both
    source: >-
      GV's product checklist; derived from real findings on unreadable values and the hand
      audits' miss lists (parts printed as zero inches).
    seen_as:
      created_by: [page_reviewer]
      words: ["overprint", "printed over the", "illegible", "TBD", "question mark", "unreadable", "overlap"]

  # --- countertop piece -----------------------------------------------------------------------

  - key: ct_overall_length
    asks: What is this countertop piece's overall length, and what does the run under it, plus a field cut at each wall end, call for?
    item_kinds: [countertop_piece]
    needs:
      - side: vendor
        fact: the top's printed overall length
        view: stone_plan
      - side: vendor
        fact: the cabinet run under the top, wall to wall, and which ends meet a wall
        view: cabinet_plan
      - side: gv_rule
        fact: the field cut added per wall end, 1 inch as GV's company standard unless the job sets another
        view: the job settings
      - side: architect
        fact: the same run's wall-to-wall length, or the parts that make it up
        view: plan or elevation
    rule: >-
      A countertop is the cabinet run it sits on plus one field cut at each end that meets a wall.
      The field cut is 1 inch per wall end as GV's company standard, unless the job sets another.
      A free or finished end takes the end overhang instead, which is a separate question because it
      is a job value, not a rule. Inches are compared exactly; millimetres are ignored. Where the
      architect prints the parts of the run and not its total, the parts are added.
    problem_when: the top's length is not the run plus a field cut at each wall end, or it differs from the architect's run.
    not_a_problem_when:
      - The run is split into more than one top; each piece is measured against its own part of the run.
      - A field cut note calls for oversize stock to be trimmed on site; the note is stock, not a design size.
      - An end of this top is free or finished rather than at a wall; that end takes the job's end overhang, never a field cut.
    decided_by: code
    compares: gv_rule
    from: both
    source: >-
      GV's settled rules, Countertop and sink (field cut 1 inch typical, per project, counted
      per wall end); rulebook CT-WIDTH-001; derived from 18 real findings across three audited
      jobs.
    seen_as:
      created_by: [field_cut, page_reviewer, helper, whole_look, formulas]
      rule_ids: [CT-WIDTH-001, CT-ARCH-WIDTH-001]
      words: ["field cut", "top length", "run + 1", "wall end", "overall length", "wall to wall"]

  - key: ct_end_overhang
    asks: How far does the top run past the cabinet at a free or finished end?
    item_kinds: [countertop_piece, vanity]
    needs:
      - side: vendor
        fact: the stone's own end position against the end of the run under it, at each end that is not at a wall
        view: stone_plan and cabinet_plan
      - side: gv_rule
        fact: the job's end overhang setting
        view: the job settings
    rule: >-
      A free or finished end takes an end overhang, not a field cut. The overhang at an end is one
      of the values the reviewer enters per job, in the same family as the side panel thickness, the
      front overhang and the splash thickness: GV has no company value for it and there is no
      default. Where the job has not set one, this question has no governing value and must say so.
    problem_when: the stone runs past its end by something other than the job's end overhang.
    missing_fact_when: no end overhang has been entered for the job, so nothing governs this end.
    not_a_problem_when:
      - The end meets a wall; a wall end takes the 1 inch field cut, which is a settled rule, not a job value.
      - No end overhang is set for the job; that is a missing job value to report as missing, never a defect and never a silent pass.
    decided_by: code
    compares: gv_rule
    from: rulebook
    source: >-
      GV's settled rules, Countertop and sink (side panel thickness, overhang and backsplash
      thickness are project specific, so the reviewer enters them per job).
