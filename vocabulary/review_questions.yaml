  # --- sink and cut-outs ----------------------------------------------------------------------

  - key: sink_cutout_size
    asks: What size is the sink cut-out, and what does the sink's inside size less the clearance each side give?
    item_kinds: [sink_cutout_sheet, countertop_piece, vanity]
    needs:
      - side: vendor
        fact: the cut-out's printed width and depth
        view: cutout_plan or stone_plan
      - side: vendor
        fact: the sink's inside width and depth
        view: the sink note on the item's sheet, or the maker's spec sheet
      - side: gv_rule
        fact: the clearance held on each side, one quarter of an inch as GV's standard, editable per project
        view: the job settings
    rule: >-
      A GV sink cut-out is the sink's inside size less the clearance on each side: the cut-out width
      is the inside width less twice the clearance, and the cut-out depth is the inside depth less
      twice the clearance. The clearance is one quarter of an inch unless the job sets another. The
      sink's own maker's cut-out template is a hint, not the rule.
    problem_when: the drawn cut-out is not the inside size less twice the clearance, in inches, exactly.
    missing_fact_when: >-
      the sink's inside size is given neither by the job nor by a spec sheet in the set.
    not_a_problem_when:
      - The architect prints no cut-out size; GV's own rule still decides it, so the answer is never "nothing to compare".
      - The millimetres work out and the inches do not; inches count.
    decided_by: code
    compares: gv_rule
    from: both
    source: >-
      GV's settled rules, Countertop and sink (cut-out width = the sink's inside width less the
      clearance each side, depth likewise; clearance a quarter of an inch, editable per
      project); rulebook CT-SINK-CUTOUT-WIDTH-001 and CT-SINK-CUTOUT-DEPTH-001; derived from 22
      real findings across three audited jobs.
    seen_as:
      created_by: [sink_offset, sink_sheets, page_reviewer, helper]
      rule_ids: [CT-SINK-CUTOUT-WIDTH-001, CT-SINK-CUTOUT-DEPTH-001]
      words: ["cut-out", "cutout", "clearance", "inside size", "bowl size", "cut out width", "cut out depth"]

  - key: sink_front_offset
    asks: How far is the cut-out from the top's own front edge, and what is GV's front offset?
    item_kinds: [sink_cutout_sheet, countertop_piece, vanity]
    needs:
      - side: vendor
        fact: the printed offset from the top's front edge to the front of the cut-out
        view: cutout_plan or stone_plan
      - side: gv_rule
        fact: GV's front offset, 4 inches as the company standard, adjustable in special cases
        view: the job settings
      - side: architect
        fact: the setback the architect gives from the front to the bowl
        view: plan or section
    rule: >-
      The front offset is measured from the top's own front edge, which is what a countertop plan
      dimensions from, and the plan is the view this check reads. The standard is 4 inches unless
      the job sets another; a person may deviate in a special case, but code never recomputes the
      offset. A printed front offset is held exactly as printed and is never adjusted by subtracting
      the front overhang or anything else.
    problem_when: the printed offset from the top's front edge is not GV's front offset, or the two sheets of one top print different offsets.
    not_a_problem_when:
      - The architect's setback runs to the bowl and the vendor's to the cut-out; those are different ends.
      - The offset is not 4 inches because a person deviated for this job; a person's deviation stands.
      - The top overhangs the cabinet, so the cut-out is nearer the cabinet face than the printed offset; the offset is read from the stone's edge, not from the cabinet, and is never converted.
    decided_by: code
    compares: gv_rule
    from: both
    source: >-
      GV's settled rules, Countertop and sink (front offset 4 inches as standard, adjustable in
      special cases) and Layouts and views (the plan carries the cut-out position and its
      offsets, and a countertop plan dimensions from the stone's own edges); the decision of
      2026-10-14 that a printed front offset is held for a person and never adjusted; rulebook
      CT-SINK-OFFSET-FRONT-001; derived from 10 real findings.
    seen_as:
      created_by: [sink_offset, sink_sheets, page_reviewer, helper]
      rule_ids: [CT-SINK-OFFSET-FRONT-001]
      words: ["front offset", "from the front", "setback", "to the cut-out", "4\" from"]

  - key: sink_back_offset
    asks: How much top is left behind the cut-out?
    item_kinds: [sink_cutout_sheet, countertop_piece, vanity]
    needs:
      - side: vendor
        fact: the printed offset behind the cut-out, or the top depth and the front offset to work it out
        view: cutout_plan or stone_plan
      - side: gv_rule
        fact: GV's minimum back offset, two and a half inches as the company standard
        view: the job settings
    rule: >-
      The back offset is whatever the depth leaves behind the cut-out once the front offset and the
      cut-out depth are taken off, and it must be at least GV's minimum.
    problem_when: the back offset is less than the minimum.
    not_a_problem_when:
      - The back offset is larger than the minimum; the minimum is a floor, not a target.
      - The top's depth is not known; the answer is then that the setting is missing.
    decided_by: code
    compares: gv_rule
    from: rulebook
    source: >-
      GV's settled rules, Countertop and sink (the back offset is whatever is left, with a
      company minimum of two and a half inches); rulebook CT-BACK-OFFSET-MIN-001.
    seen_as:
      created_by: [sink_offset, page_reviewer]
      rule_ids: [CT-BACK-OFFSET-MIN-001]
      words: ["back offset", "behind the cut", "behind the sink"]

  - key: sink_position_along_the_top
    asks: Where along the top is the sink's centre, measured from a named end or wall?
    item_kinds: [sink_cutout_sheet, countertop_piece, vanity]
    needs:
      - side: vendor
        fact: the distance from a named end or wall to the cut-out's centre
        view: stone_plan
      - side: vendor
        fact: the same distance as printed on the cabinet plan
        view: cabinet_plan
      - side: architect
        fact: the architect's dimension to the sink or to the sink cabinet's centre
        view: plan
    rule: >-
      The sink's centre is the sink base's centre. The distance must be measured from the same end on
      both sheets of the item, and must agree with the architect where the architect prints it.
    problem_when: the stone sheet and the cabinet plan put the sink in different places, or the position differs from the architect's.
    not_a_problem_when:
      - The two values are measured from opposite ends; convert before comparing.
      - The architect gives the sink as a tag and a symbol with no dimension; there is nothing to compare.
    decided_by: code
    compares: vendor_only
    from: both
    source: >-
      The rulebook formula 'sink centre = the sink base's centre'; derived from the hand audits'
      miss lists (an item's stone sheets and cabinet plans placing one sink an eighth to three
      eighths of an inch apart).
    seen_as:
      created_by: [sink_sheets, page_reviewer, helper, formulas]
      words: ["sink centre", "centre line", "from the end", "from the wall", "sink position"]

  - key: sink_model_and_supply
    asks: Does this set say, once, which sink and faucet are used and who supplies them?
    item_kinds: [cover_sheet]
    needs:
      - side: vendor
        fact: the set's general notes and any spec sheet naming the sinks and faucets and who supplies them
        view: notes and spec_sheet
    rule: >-
      This is a set-level question, asked once for a whole job, on the set's notes or spec sheets.
      It is never asked per item and never per view. Across four audited runs it produced 45 answers
      and not one first-time real problem: 30 were trivial repeats of the same point on another
      sheet and 12 were outright wrong. One set-level note answers it for the whole job.
      A sink model name and an architect tag are different kinds of label and are never compared as
      values: the architect names a tag, not a product.
    problem_when: no sheet in the whole set names the sinks and faucets or says who supplies them.
    not_a_problem_when:
      - An item sheet does not name the supplier; the set's general notes answer it for every item.
      - A vendor model name sits beside an architect tag; that is not a conflict.
      - Two similar model names appear because the set uses two sinks, a standard one and an accessible one.
      - A sink is named on one sheet of an item and not on another sheet of the same item.
    decided_by: ai
    compares: vendor_only
    from: rulebook
    source: >-
      GV's product checklist, sink; 45 audited answers produced no first-time real problem (30
      trivial repeats, 12 wrong), which is why it is asked once for a whole job.
    seen_as:
      created_by: [page_reviewer, helper, whole_look]
      words: ["sink model", "sink tag", "who supplies", "supplier", "by GV", "by others", "faucet"]

  - key: sink_note_size_matches_the_sink
    asks: Does the sink note printed on this sheet give the sink's own size, the right way round?
    item_kinds: [sink_cutout_sheet, countertop_piece, vanity, base_cabinet_run]
    needs:
      - side: vendor
        fact: the sink callout's quoted width, depth and height
        view: elevation, plan or the sheet's sink note
      - side: vendor
        fact: the sink's real outside and inside sizes, and the cut-out's size
        view: cutout_plan, the item's plan, or the maker's spec sheet
    rule: >-
      A sink callout quotes the sink's own size, not the cut-out's, and its width is the dimension
      along the run while its depth is the dimension front to back. The same callout on every sheet
      of the item must quote the same numbers.
    problem_when: the callout quotes the cut-out's numbers as the sink's size, the width and depth are the wrong way round, or two sheets of the item quote different numbers.
    not_a_problem_when:
      - The callout quotes the sink's outside size on one sheet and its inside size on another, and says which is which.
    decided_by: code
    compares: vendor_only
    from: misses
    source: >-
      Derived from the hand audits' miss lists: sink callouts quoting the cut-out's numbers,
      with width and depth swapped, on four sheets of two jobs.
    seen_as:
      created_by: [sink_sheets, page_reviewer, helper]
      words: ["swapped", "W x", "\"W", "\"D", "callout", "sink note", "sink size"]

  - key: sink_bowl_count
    asks: How many bowls does the sink have, and how many does the architect draw?
