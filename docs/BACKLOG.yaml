# Shared Definition of Done, appended to every story body.
definition_of_done: |
  ### Definition of Done
  - [ ] Unit tests written and passing; failure modes tested, not just happy path
  - [ ] `ruff` + `black` clean; `mypy` clean (strict for `verdict/`, `rules/`, `evidence/`)
  - [ ] No new dependency without a licence check (no AGPL — see `AGENTS.md` §2.8)
  - [ ] Gold-set run does not regress critical false-PASS (once a gold set exists)
  - [ ] Plain-English docstrings/copy; no over-promising
  - [ ] Traceability recorded: Source and Verification named in this issue

