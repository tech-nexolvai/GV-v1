decisions:
  - id: D1
    title: "D1 — Unit policy: canonical mm vs authored-unit arithmetic"
    labels: [type:decision, area:units, safety-critical, P0]
    milestone: "M-DEC — Decisions & Client Questions"
    body: |
      ## Decision required
      `AGENTS.md` §6 mandates canonical mm and conversion of all values. Measured evidence from the
      real GV shop drawing shows this is unsafe as written.

      ## Evidence (verified, `docs/V1_RESEARCH_AND_PLAN.md` §F1)
      Every dimension is written twice — mm with the inch fraction in brackets, e.g. `984 [38 3/4]`.
      Each unit system closes **exactly** within itself, but they do not convert exactly to each other:

      | mm on drawing | inch on drawing | inch → mm | delta |
      |---:|---:|---:|---:|
      | 6012 | 236 3/4 | 6013.450 | **1.450** |
      | 100  | 4       | 101.600  | **1.600** |
      | 864  | 34      | 863.600  | 0.400 |

      **Worst delta 1.600 mm exceeds a 1/16″ tolerance (1.5875 mm).**

      Mixing units inside one arithmetic check therefore injects up to 1.6 mm of pure rounding noise.
      A check could FAIL a perfect drawing, or — the dangerous case — PASS a drawing that is out of
      tolerance. That is a false-PASS, the primary safety metric.

      ## Recommendation
      1. Canonical mm for storage, cross-document comparison and display.
      2. Additionally persist the **exact original token** (`Fraction`) and its original unit on every
         observation. Never discard what the drawing actually said.
      3. Rule-level `arithmetic_unit`. All operands in one arithmetic operation must share the authored
         unit system; otherwise apply an explicitly declared rounding allowance or return REVIEW REQUIRED.
      4. The bracketed alternate unit becomes a **corroboration lane** with a rounding-aware band,
         never an independent operand.

      ## Consequence if rejected
      Tolerances at or below 1/16″ cannot be trusted, and the primary safety metric is compromised.

      **This amends a golden rule in `AGENTS.md` §6 and needs explicit sign-off.**

  - id: D2
    title: "D2 — Add a typed `derivations:` DAG to the rule schema"
    labels: [type:decision, area:rules, safety-critical, P0]
    milestone: "M-DEC — Decisions & Client Questions"
    body: |
      ## Decision required
      Client formulas chain. `CT010 = C.T_OH + CT007 + CT008 + CT009 + B.S_THK`, where `CT009` is
      itself obtained by rearranging that same formula and then compared to a minimum. `CT004 =
      CAB_SIDE_THK + CT011 + CT012 + CT013 + CAB_SIDE_THK`.

      The current schema has a single `operation:` block and cannot express any of this.

      ## Recommendation
      Add a `derivations:` block — named intermediates, each computed by a **typed** operation from
      inputs, parameters or earlier derivations, forming a DAG validated as **acyclic at publish time**.
      Still typed, still no `eval`, still exact arithmetic.

      ## Consequence if rejected
      Most of the client's real checks are inexpressible. Larger gap than the aggregate operations
      `docs/RULE_ENGINE_SPEC.md` already identified.

      Source: `docs/V1_RESEARCH_AND_PLAN.md` §F6

  - id: D3
    title: "D3 — Add `severity` to the rule schema"
    labels: [type:decision, area:rules, safety-critical, P0]
    milestone: "M-DEC — Decisions & Client Questions"
    body: |
      ## Decision required
      Two problems, one fix.

      1. The client checklist explicitly asks for a **warning** (`CT009` back-offset: *"program should
         throw warning"*). Our outcome model has only PASS / FAIL / NOT FOUND / REVIEW REQUIRED.
      2. More seriously: **"critical false-PASS rate" is the primary release metric, and nothing in the
         schema defines which checks are critical.** The metric is currently unmeasurable as specified.

      ## Recommendation
      Add `severity: CRITICAL | MAJOR | MINOR | ADVISORY` to the rule schema. Define the primary metric
      as false-PASS on CRITICAL rules. Render ADVISORY outcomes as warnings, not failures.

      Source: `docs/V1_RESEARCH_AND_PLAN.md` §F7

  - id: D4
    title: "D4 — Add a `PRODUCT_SPEC` document role"
    labels: [type:decision, area:evidence, P0]
    milestone: "M-DEC — Decisions & Client Questions"
    body: |
      ## Decision required
      `document_role` is currently `ARCH | SHOP`. Sink interior dimensions come from the
      **manufacturer's cut sheet** (the client's example is Kohler K-2330-G) — a third document.

      Without a `PRODUCT_SPEC` role, the entire sink-cutout family (three of the five countertop checks)
      has no authoritative source and can only ever return NOT FOUND.

      ## Recommendation
      Add the role; ingest cut sheets as versioned, hashed documents like any other source; add a
      per-project product/spec registry.

      Depends on **Q7** (will GV supply cut sheets per project?).

      Source: `docs/V1_RESEARCH_AND_PLAN.md` §F4

  - id: D5
    title: "D5 — Add a `project_parameter_sets` aggregate"
    labels: [type:decision, area:rules, P0]
    milestone: "M-DEC — Decisions & Client Questions"
    body: |
      ## Decision required
      Nine values required by the rules appear on **no drawing at all**: door thickness, countertop
      overhang, backsplash thickness, cabinet side panel thickness, field cut size, filler min/max,
      sink front offset minimum, sink depth, and the field wall-to-wall dimension. The client sources
      them from "G.C / Client", "Company standard" or on-site measurement.

      The backend data model (proposal §10.1) has **no aggregate for these**.

      ## Recommendation
      Versioned `project_parameter_sets` with layered resolution (global standard → project override →
      run override), full provenance, and a hard rule: **a missing parameter is NOT FOUND, never a
      silent default.** Also a UI requirement — the reviewer must enter and see them.

      Source: `docs/V1_RESEARCH_AND_PLAN.md` §F5

  - id: D6
    title: "D6 — Canonical semantic vocabulary = the client's `CT0xx` codes"
    labels: [type:decision, area:rules, P1]
    milestone: "M-DEC — Decisions & Client Questions"
    body: |
      ## Decision required
      `rules/semantic_types.py` currently uses our own provisional names
      (`countertop_overall_width`, …). The client's own workbook uses `CT001`–`CT013`, `B.S_THK`,
      `C.T_OH`, `CAB_SIDE_THK`, and `A_/S_/F_` prefixes for arch/shop/field.

      The client codes are unambiguous, already their language, and — critically — **anchored to an
      annotated diagram** (`CT_image10`) that defines each one positionally.

      ## Recommendation
      Adopt `CT0xx` as canonical, keep our descriptive names as aliases. Resolves the open
      "semantic type vocabulary" question in `memory.md`, and inverts the current provisional approach.

      Source: `docs/V1_RESEARCH_AND_PLAN.md` §3

  - id: D7
    title: "D7 — Explicit \"no applicable rule\" outcome"
    labels: [type:decision, area:rules, safety-critical, P0]
    milestone: "M-DEC — Decisions & Client Questions"
    body: |
      ## Decision required
      Every client countertop check is scoped to walls on three sides (confirmed by the client's own
      image, *"Vanity with a wall on 3 sides"*). Island, back-only and two-wall layouts have **no
      authored rule**.

      ## Recommendation
      The applicability resolver must return an explicit **"no applicable rule"** outcome, surfaced as
      REVIEW REQUIRED. An unchecked package must never render as clean.

      **Silence is the most dangerous possible false-PASS** — a reviewer seeing no findings will
      reasonably assume the package was checked.

      Source: `docs/V1_RESEARCH_AND_PLAN.md` §F12

  - id: D8
    title: "D8 — Derived expectations may be shown, never issued as instructions"
    labels: [type:decision, area:rules, P1]
    milestone: "M-DEC — Decisions & Client Questions"
    body: |
      ## Decision required
      The client's variable table marks most values *"Calculated / System Calc"* and asks the system to
      distribute surplus width across adjustable cabinets. That is closer to design assistance than to
      validation, and `README.md` states the product "validates drawings; it never designs them".

      ## Recommendation
      The engine may compute derived **expectations** and display them in a finding as "derived expected
      value" with the full calculation trace — that is arithmetic, and it is how a reviewer understands a
      FAIL. But V1 must not emit computed dimensions to a vendor as instructions without reviewer
      sign-off.

      Worth stating explicitly rather than leaving to interpretation — it is a contractual and liability
      boundary, not just a technical one.

      Source: `docs/V1_RESEARCH_AND_PLAN.md` §F11

# ==========================================================================
questions:
  - id: Q1
    title: "Q1 — How many field cuts, and are they added or trimmed? (blocks CT-1)"
    labels: [type:question, blocked:client, area:rules, safety-critical, P0]
    milestone: "M-DEC — Decisions & Client Questions"
    body: |
      ## Question for Raj
      `Countertop_Checks_Updated.xlsx` cell `D21` says:

      > *"If the wall to wall dimension is 84", total width = 1" (field cut) + Wall to Wall dimension :
      > 84" + 1" (field cut)"*

      This reads as either **85″** (one field cut) or **86″** (two field cuts).

      A third reading comes from the real shop drawing, which annotates
      **"5″ FILLER PANEL TO BE FIELD CUT AS PER SITE CONDITION"** at both ends — suggesting the field cut
      is *taken out of an oversized filler*, not *added to the countertop*.

      ## Why it blocks
      This changes CT-1's arithmetic directly. We will not guess.

      ## What we need
      1. For a three-wall vanity, how many field cuts apply, and what is the default size?
      2. Is the field cut **added** to the countertop dimension, or **removed** from the filler?
      3. Is `docs/RULE_ENGINE_SPEC.md`'s assumption (2 cuts for three-wall, 1 for two-wall, 0 for island)
         correct?

      Blocks: CT-1 authoring.

  - id: Q2
    title: "Q2 — Tolerance values per check and per wall configuration (blocks all verdicts)"
    labels: [type:question, blocked:client, area:rules, safety-critical, P0]
    milestone: "M-DEC — Decisions & Client Questions"
    body: |
      ## Question for Raj
      **No tolerance value appears anywhere in the client material.** We read both workbooks cell by cell
      and all 16 embedded diagrams.

      The 1/8″ and 1/16″ figures in `docs/RULE_ENGINE_SPEC.md` are **our assumption**, not a client
      confirmation. `memory.md` records only that "tolerance depends on wall layout".

      ## Why it blocks
      A tolerance is the entire difference between PASS and FAIL. An assumed tolerance produces
      confidently wrong verdicts — including false-PASS, our primary safety metric.

      ## What we need
      A tolerance for each check, per wall configuration where it varies:
      - Countertop width (CT-1)
      - Countertop depth (CT-2)
      - Sink cutout width / depth / offsets (CT-3 family)
      - Cabinet width, arch vs shop
      - Filler width min and max

      Note also **D1**: at 1/16″ the tolerance is smaller than the drawing's own mm/inch rounding
      spread (1.6 mm), so very tight tolerances need the unit policy resolved too.

      Until answered, tolerances are explicit placeholders that **fail loudly** — never defaults.

  - id: Q3
    title: "Q3 — Does \"cabinet width\" include the end panel?"
    labels: [type:question, blocked:client, area:rules, safety-critical, P0]
    milestone: "M-DEC — Decisions & Client Questions"
    body: |
      ## Question for Raj
      In `Cabinet_Checks.xlsx` diagram `CAB_image2`, the **"Cab 1 Width"** bracket appears to span both
      the `51 [2]` end segment **and** the `533 [21]` cabinet body.

      ## Why it matters
      If cabinet width includes the end panel, the CT-1 sum double-counts it (end panels would be
      counted both as part of the cabinet and separately). Materially changes the arithmetic.

      ## What we need
      - Does `CAB_1` width mean the carcass only, or carcass + end panel?
      - Are `END PANEL` and `FILLER PANEL` distinct items with separate widths? The real drawing labels
        both at the same location.

  - id: Q4
    title: "Q4 — Which checks are critical vs advisory? (severity)"
    labels: [type:question, blocked:client, area:rules, safety-critical, P0]
    milestone: "M-DEC — Decisions & Client Questions"
    body: |
      ## Question for Raj
      Our primary safety metric is the **critical false-PASS rate** — a wrong PASS that could be
      manufactured. To measure it we must know which checks are critical.

      The checklist already implies a lesser severity: the `CT009` back-offset rule says the program
      should *"throw warning"*, not fail.

      ## What we need
      For each check, a severity:
      - **CRITICAL** — a wrong PASS could be manufactured and cost money
      - **MAJOR** — real defect, caught downstream
      - **MINOR** — cosmetic or easily corrected
      - **ADVISORY** — warning only, never a FAIL

      Related: **D3**.

  - id: Q5
    title: "Q5 — Sink front offset: minimum or exact equality?"
    labels: [type:question, blocked:client, area:rules, P0]
    milestone: "M-DEC — Decisions & Client Questions"
    body: |
      ## Question for Raj
      The workbook contradicts itself:
      - `X19` — *"Front offset B. Typical dimension is 4" **minimum**"*
      - `X27` (pass criteria) — *"Front offset **= 4"**. Back offset = 2.375"*
      - `CT007` acquisition — *"Global **Minimum**"*, source *"Company standard"*

      A minimum (`≥ 4"`) and an equality (`= 4"`) are different checks producing different verdicts on
      the same drawing.

      ## What we need
      Which is it, for front offset and for back offset independently? Our reading is that front is a
      minimum and back is a target coordinated with the faucet hole — please confirm.

  - id: Q6
    title: "Q6 — CT009 / CT010: which is observed and which is derived?"
    labels: [type:question, blocked:client, area:rules, P0]
    milestone: "M-DEC — Decisions & Client Questions"
    body: |
      ## Question for Raj
      Both `CT009` (Sink Back Offset) and `CT010` (Countertop Depth) are marked *"Calculated / System
      Calc"*, and each is defined in terms of the other:

      ```
      CT010 = C.T_OH + CT007 + CT008 + CT009 + B.S_THK
      CT009 warning if (CT010 − C.T_OH − CT007 − CT008 − B.S_THK) < global minimum
      ```

      ## What we need
      Our reading: `CT010` is **read from the drawing**, and `CT009` is **solved for** and then checked
      against a minimum. Please confirm — the direction determines which value is evidence and which is
      arithmetic, and only evidence needs an extraction route.

  - id: Q7
    title: "Q7 — Client questions needed before Phase 3 (non-blocking today)"
    labels: [type:question, blocked:client, area:rules, P1]
    milestone: "M-DEC — Decisions & Client Questions"
    body: |
      ## Questions for Raj — needed before the rules phase, not blocking today

      **Q7 — Sink cut sheets.** Will GV supply the manufacturer's spec sheet (e.g. Kohler K-2330-G) per
      project? The sink checks have no authoritative source without it. Confirms **D4**.

      **Q8 — The other branch.** `Condition 1` only defines `F_Wall_2_Wall > A_Wall_2_Wall`. What happens
      when the **field dimension is smaller** than design? Common and consequential — cabinets must
      shrink or be cut.

      **Q9 — Non-adjustable cabinets.** The note says sink cabinets and cabinets with equipment cannot be
      adjusted. How are these identified **in the drawing** so the distribution logic can exclude them?

      **Q10 — "U.N.O." handling.** "Unless Noted Otherwise" appears twice — a drawing note can override a
      global constant. Proposed V1 policy: detect the override and return REVIEW REQUIRED rather than
      auto-applying it. Confirm?

      **Q11 — ADA.** The sink cut sheet carries a "Recommended ADA Installation" block, and the real
      drawing's cabinet height (864 mm) is exactly the 34″ ADA maximum. Is ADA compliance in V1 scope?

      **Q12 — Dual units.** When the mm and bracketed inch values disagree beyond rounding, which governs?

      **Q13 — Two depth formulas.** `cabinet_depth + overhang` (sheet `I23`) vs the five-term `CT010`.
      Both? Should they cross-check each other?

      **Q14 — Wall configurations.** Are layouts other than three-wall in V1 scope? Today only three-wall
      has authored rules.

  - id: Q15
    title: "Q15 — Confirm suspected errors in the client checklist"
    labels: [type:question, blocked:client, area:rules, P1]
    milestone: "M-DEC — Decisions & Client Questions"
    body: |
      ## For Raj — suspected typos, please confirm

      We will **not** silently "fix" a client specification. Each of these looks like a copy-paste slip;
      please confirm so we can author the rule correctly.

      | # | Cell | Text as written | Suspected intent |
      |---|---|---|---|
      | Q15 | `S19` | "Sink cutout width (A) = sink interior **depth** (E) − 0.25 − 0.25" | interior **width** |
      | Q16 | `S29` | "Width of countertop <> Sink cutout **depth** (A) + F + G" | **width** |
      | Q17 | `I3` | header "CT-2 : Countertop **Width** Verification" | rule name says **Depth** |
      | Q18 | `D3/I3/N3/S3/X3` | three different checks all labelled **CT-3** | unique IDs needed |
      | Q19 | `S27` | "Width of **countertop** = Sink cutout width (A) + F + G" | describes the **sink cabinet** (`CT004`), not the whole countertop |
      | Q20 | workbook | two naming schemes coexist: letters A–G on Sheet1, `CT0xx` on the variable sheet | adopt `CT0xx` as canonical, letters as aliases |

      Related: **D6**.

