# The local stack: PostgreSQL and the Hatchet engine (#416, F3.2).
#
# Local development only. No reverse proxy, no TLS, no cloud — #151 owns deployment, and this file
# deliberately does not anticipate it. Everything here is insecure-by-configuration in ways that are
# fine on a laptop and would not be anywhere else, which is why each of those settings says so.
#
# PostgreSQL 17 and pgvector are pinned to match CI — a different major version locally would let a
# migration behave differently in the two places, which is the class of difference this file exists to
# remove. Without it the database tests skip, and a mismatch between a model and its migration only
# surfaces on CI, which is how #201's naive-timestamp bug was found.
#
#   make up          # this stack
#   make token       # the one-time step: mint a client token for the worker
#   make migrate     # Alembic, against the application database
#   make serve       # the API
#   make worker      # runs the stages
#   make dispatch    # drains the outbox
#
# CONTRIBUTING.md has the runbook in order, from a clone to a package the API has accepted.
#
# **On ports.** PostgreSQL is on 5433, not 5432, because a developer very likely already runs one and a
# silent connection to the wrong database is a bad afternoon. The engine keeps its own documented ports
# (8888 dashboard, 7070 gRPC) so that anything you read in Hatchet's own documentation applies here
# unchanged — moving them means moving `SERVER_GRPC_BROADCAST_ADDRESS` too, and a mismatch there fails
# as "worker cannot connect" with no hint why.
#
# The data is deliberately not persisted to a volume for either service: these are development and test
# databases, and a stale one that survives a schema change is a source of confusing failures.

services:
  db:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: gv
      POSTGRES_PASSWORD: gv
      POSTGRES_DB: gv
    ports:
      - "5433:5432"
    volumes:
      # Creates the engine's own logical database on first start. Read-only: this is our script and the
      # container has no business editing it.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gv"]
      interval: 2s
      timeout: 3s
      retries: 15

  hatchet:
    # Pinned by digest, not by `:latest`. `latest` means two developers on the same commit can run two
    # different engines, and the one who hits a bug cannot say which. This digest is the image that was
    # actually brought up and verified for this story.
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite@sha256:098f549448de860e95f79f93583dc353be3143a6bb2f6eba446b3d443e39e838
    depends_on:
      db:
        # Not merely "started": the engine runs its own migrations on boot, and against a PostgreSQL
        # still starting up that fails and takes the container down.
        condition: service_healthy
    ports:
      - "8888:8888"   # dashboard and REST API
      - "7070:7070"   # gRPC, which is what a worker connects to
    environment:
      # The engine's own database, created by docker/postgres-init. `db` is the service name, so this is
      # the in-network address; from the host the same server is localhost:5433.
      DATABASE_URL: postgresql://gv:gv@db:5432/hatchet
      DATABASE_POSTGRES_HOST: db
      DATABASE_POSTGRES_PORT: "5432"
      DATABASE_POSTGRES_USERNAME: gv
      DATABASE_POSTGRES_PASSWORD: gv
      DATABASE_POSTGRES_DB_NAME: hatchet
      DATABASE_POSTGRES_SSL_MODE: disable

      SERVER_URL: http://localhost:8888
      SERVER_GRPC_BIND_ADDRESS: 0.0.0.0
      SERVER_GRPC_PORT: "7070"
      # What the engine tells a worker to dial back on. It must be reachable *from the worker*, and the
      # worker runs on the host — so this is a host address, not the service name.
      SERVER_GRPC_BROADCAST_ADDRESS: localhost:7070
      SERVER_GRPC_INSECURE: "t"

      # Local-only conveniences, each one a thing you would never set on a real deployment:
      # no TLS on the cookie, and accounts treated as email-verified so there is no mail step.
      SERVER_AUTH_COOKIE_DOMAIN: localhost
      SERVER_AUTH_COOKIE_INSECURE: "t"
      SERVER_AUTH_SET_EMAIL_VERIFIED: "t"

      # V1 explicitly. `workflow/review.py` is written against the v1 API — `hatchet.workflow(...)`
      # with `@wf.task` — so an engine defaulting to V0 would register nothing and the worker would sit
      # idle with no error worth reading.
      SERVER_DEFAULT_ENGINE_VERSION: V1
    healthcheck:
      # The dashboard's readiness endpoint. `wget --spider` because it exits non-zero on a bad status
      # without downloading a body — the image carries wget, curl and nc, so this is a choice rather
      # than the only option.
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8888/api/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      # The first start runs migrations and the quickstart before anything listens, so the check needs
      # room to fail for a while without the container being declared unhealthy.
      start_period: 60s
