name: CI

on:
  push:
    branches: [main]
  # `ready_for_review` so a draft that is marked ready gets its run; every job below skips drafts.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Weekly, for the one check that needs the network: has CodeRabbit's published config schema moved
  # under us? The offline check keeps passing against the vendored copy, so without this the copy can go
  # stale indefinitely and an upstream constraint change would surface as a collapsed warning in a PR
  # comment — the same signal that hid the original config defect for eight days.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# A newer push to the same branch cancels the older run: two runs of the same suite on a superseded
# commit tell nobody anything, and the second one to finish overwrites the first's answer.
#
# **Minutes are billed.** The repository is private (`gh repo view` reports `visibility=PRIVATE`,
# 2026-10-09; an earlier comment here said public, which is no longer true), so every job's runtime counts
# against the plan's quota, rounded up to the whole minute per job. That is why every job has a timeout,
# draft pull requests do not run, and Python packages install with uv from a cache.
#
# **No path filters, deliberately.** A documentation-only change can fail this workflow and must: the
# risk register, issue-gate and ADR tests read docs/, README.md and CONTRIBUTING.md, so a docs-only
# change can break the build. Skipping "docs-only" pushes would skip exactly those tests.
# No check in this workflow scans files for client values: the client-facts test only checks that
# docs/CLIENT_FACTS.md parses, and the vendor-neutrality test checks imports. Keeping client values out
# of GitHub is a review rule, not something CI enforces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality_checks:
    name: Python quality
    # Not on the weekly schedule. That cron exists for the one network check below, so the schedule
    # buys the drift check and not a second full run of everything: a weekly rerun of an unchanged tree
    # answers no question. Not on draft pull requests either; marking one ready runs everything.
    if: github.event_name != 'schedule' && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a commit SHA, and the checkout credential is dropped. zizmor flags both: a floating tag
      # can be moved under us by anyone who controls the upstream repository, and a persisted credential
      # can leave the runner inside an artifact. Nothing in this workflow writes to git — the only git
      # command is `git ls-files`, which needs no auth — and the one step that talks to the API gets its
      # token from `GH_TOKEN` in the environment, not from the checkout. Verified before changing this.
      # `fetch-depth: 1` is the action's default; written down so nobody turns on full history by accident.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      # Python 3.12 is the declared target in AGENTS.md section 4. Test the floor
      # we promise, not whatever is newest.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # uv installs the same floors as pip (`uv pip install`, no lock file, highest versions, as pip
      # resolves them) in seconds instead of most of a minute, from a cache keyed on pyproject.toml.
      # Local development already uses uv. The weekly job below keeps plain pip on purpose: it asks what
      # a clean machine resolves today.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # `reports` joins the list with D2.1 (#225): tests/reports/ imports reportlab and pypdf at
      # module level, so without it the redline tests do not skip, they fail to collect.
      - name: Install
        # `ocr` is here so the RapidOCR adapter is actually exercised. The engine is injectable and
        # every wiring test uses a stub, so without the extra the adapter itself would run in no test
        # anywhere — and a skipped test reads as coverage.
        run: uv pip install --system -e ".[ai,dev,extraction,ocr,rules,platform,reports]"

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      # Strict in the safety-critical zones. mypy is a no-op while these packages
      # are empty, and starts biting the moment real code lands.
      - name: Mypy (strict — verdict, rules, evidence)
        run: mypy verdict rules evidence

      - name: Mypy (rest of the tree)
        run: mypy app workflow extraction retrieval reports eval
        continue-on-error: true

  test_shards:
    name: tests (shard ${{ matrix.group }}/4)
    if: github.event_name != 'schedule' && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    runs-on: ubuntu-latest
    # About 5 minutes each today; 15 stops a hung test long before it drains the quota.
    timeout-minutes: 15
    # Four shards, kept. Billing rounds each job up to the minute, and each shard pays about a minute
    # of fixed cost (database container, checkout, install). Three shards of ~6 minutes bill more than
    # four of ~5, and two would double the wait for a result.
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    services:
      postgres:
        # Every shard owns an isolated PostgreSQL service and database.
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: gv_test
          POSTGRES_PASSWORD: gv_test
          POSTGRES_DB: gv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gv_test -d gv_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://gv_test:gv_test@localhost:5432/gv_test

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install test dependencies
        run: uv pip install --system -e ".[ai,dev,extraction,ocr,rules,platform,reports]"

      # Check the partition before executing any shard. Collection does not execute tests;
      # group 1 proves the four lists are nonempty, disjoint, and exactly cover collection.
      - name: Verify complete, non-overlapping shard coverage
        if: matrix.group == 1
        run: python scripts/check_pytest_shard_coverage.py --splits 4

      - name: Run complete pytest shard
        run: >-
          pytest -q --splits 4 --group ${{ matrix.group }}
          --splitting-algorithm least_duration
          --durations-path .test_durations

  # Keep the existing required branch-protection check name. It aggregates the quality job
  # and every matrix shard, so a failed or skipped shard cannot be hidden by another green job.
  required_ci:
    name: lint, types, tests
    needs: [quality_checks, test_shards]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: >-
      always() && github.event_name != 'schedule'
      && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    steps:
      - name: Require every quality and test shard job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality_checks.result }}
          TEST_SHARDS_RESULT: ${{ needs.test_shards.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TEST_SHARDS_RESULT" = success

  # The frontend sat in the repository unchecked, and a dependency conflict shipped to main as a
  # result: openapi-typescript pins peer typescript@^5.x, the project is on 6, and `npm ci` failed
  # from a clean checkout while all four Python checks stayed green. A working tree that already has
  # node_modules never has to resolve that, which is exactly why it was invisible.
  #
  # `api:check` is the one that matters most. src/api/schema.d.ts is generated from the API's own
  # OpenAPI document, and the guarantee — rename a field on the server and the frontend stops
  # compiling — is only real if regenerating is verified to produce no diff.
  frontend:
    name: frontend (install, types, build)
    if: github.event_name != 'schedule' && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/main

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/main/package-lock.json

      # `ci`, not `install`: it fails on a lockfile that disagrees with package.json rather than
      # quietly resolving something new, which is the whole reason this job exists.
      - name: Install
        run: npm ci

      - name: Types
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.app.json

      # What a reviewer sees — the elevation drawing, the cabinet dropdown, the findings table —
      # rendered and asserted, on captured server responses rather than a running server (#823).
      # Unrun, they broke in #807 and nothing noticed, because nothing ran them.
      - name: Component tests
        run: npm run test:components

      # The new shadcn/ui components, clicked and opened in jsdom (Vitest), plus the guards that keep
      # Tailwind from touching the legacy pages: every old stylesheet stays in the legacy layer, no
      # old class name becomes a utility, and the new colour tokens meet contrast (#1029).
      - name: Interactive component tests
        run: npm run test:ui

      - name: Build
        run: ./node_modules/.bin/vite build

      # Needs Python, because the schema is exported from the route table rather than fetched from a
      # running server - that is what makes it safe here and unable to drift from what is deployed.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install the API for schema export
        working-directory: .
        run: uv pip install --system -e ".[ai,dev,rules,platform,reports]"

      - name: Generated API types are current
        run: npm run api:check

  # ---------------------------------------------------------------------------
  # Guards. These are the checks that turn the project's invariants from prose
  # into build failures. Each is added by its own issue; until then the step is
  # a placeholder so the wiring is obvious.
  #
  #   #33  licence policy   — fail on any AGPL dependency (e.g. pymupdf)
  #   #36  verdict isolation — fail if verdict/ imports extraction, retrieval,
  #                            network or model code, or contains eval(
  #   #38  repo hygiene      — fail if anything under data/ is ever tracked
  # ---------------------------------------------------------------------------
  guards:
    name: safety guards
    if: github.event_name != 'schedule' && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # **No token in this job, deliberately.** It runs tests/test_verdict_isolation.py, and
    # `.coderabbit.yaml` says to flag any use of credentials in a job that runs the verdict tests. The
    # board-drift check needs an API token, so it moved to its own job below rather than lending this one
    # a credential it has no business holding.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      # Cheap and useful today: proprietary client material must never be
      # committed. Full version lands with #38.
      - name: No client data in version control
        run: |
          if git ls-files --error-unmatch data/ >/dev/null 2>&1; then
            echo "::error::Files under data/ are tracked. Client drawings and"
            echo "::error::checklists are proprietary and must never be committed."
            git ls-files data/
            exit 1
          fi
          echo "OK — nothing under data/ is tracked."

      # The most important invariant in the product: AGENTS.md section 2.1 forbids any
      # path from AI, OCR or retrieval into the verdict. Asserts the import table in
      # docs/DESIGN.md section 2, transitively.
      #
      # NB: a bare ' #' in a YAML scalar starts a comment before the shell sees the
      # line, which truncates the command. Use block scalars and avoid '#' in them.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # Same extras as the quality job, deliberately. A minimal install was cheaper but meant a
      # guard could fail to *collect* on a missing optional dependency while passing locally —
      # that happened twice (#157 on PyYAML, and a root conftest on SQLAlchemy). A guard that does
      # not run is worse than a slow one.
      - name: Install test tooling
        run: uv pip install --system -e ".[ai,dev,extraction,rules,platform]"

      - name: Verdict isolation
        run: |
          pytest tests/test_verdict_isolation.py -q

      # Custom rules encoding the golden rules at the expression level, where the
      # import-graph test cannot reach: no float or rounding in the decision path, no
      # defaulted tolerance, no PASS returned from an exception handler.
      #
      # Semgrep OSS runs entirely on the runner — no account, no login, and no code
      # leaves. That matters because the client's rule logic is commercially sensitive.
      - name: Install semgrep
        run: uv pip install --system semgrep

      - name: Prove database float-column guard
        run: pytest tests/app/test_float_column_guard.py -q

      # The setting proposer may point at a passage, never write a setting (#849). Run here because
      # this job has semgrep installed; elsewhere the file's semgrep tests skip.
      - name: Prove the proposer-never-writes-a-setting guard
        run: pytest tests/workflow/test_proposer_never_writes_a_setting.py -q

      - name: Golden rules (semgrep)
        run: |
          semgrep --config .semgrep/gv-rules.yaml --error --quiet

      # Every risk in the architecture's register must name a control that exists. Runs after
      # semgrep because it verifies semgrep rule ids among other references, and after the other
      # guards because it is the guard that checks the guards are still there.
      #
      # It fails in both directions: an ENFORCED control whose artifact is missing, and a PLANNED
      # one whose artifact has quietly appeared. The second is what stops the register drifting
      # into a document nobody trusts.
      - name: Risk-control traceability
        run: |
          pytest tests/test_risk_controls.py -q


  # ---------------------------------------------------------------------------
  # Split out of `guards` so that job holds no credential. Two things claim to say whether a story may
  # be worked on: the contract in the issue body, which scripts/issue_gate.py reads, and the status
  # label, which every human, board view and filter reads. Nothing made them agree, so they drifted — a
  # sweep found eighteen disagreements across 135 open issues, twelve showing 'ready' on work the gate
  # stops.
  #
  # This is a board check, not a code check, so it can fail a pull request that changed nothing. That is
  # the point. The alternative is a sweep somebody remembers to run, and the last one was the first one.
  # ---------------------------------------------------------------------------
  board:
    name: board status drift
    if: github.event_name != 'schedule' && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install
        run: uv pip install --system -e ".[ai,dev,rules,platform]"

      - name: Board status drift (label vs contract)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pytest tests/test_board_drift.py -q
          python scripts/check_board_drift.py

  # ---------------------------------------------------------------------------
  # Weekly only. Everything else in this workflow must pass or fail for reasons
  # inside the repository; this one asks a question about the outside world, so
  # it is kept away from the pull-request path where a network blip would look
  # like a broken change.
  # ---------------------------------------------------------------------------
  weekly:
    name: weekly checks (config schema, dependencies)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Pinned to commit SHAs and with the checkout credential dropped, both on zizmor's advice: an
      # unpinned tag can be moved under us, and a persisted credential can leak through an artifact.
      # This job needs neither — it reads the tree and talks to one public URL. The comments name the
      # tags so the pins are still readable.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # The full extra set, because the licence check below is only as good as what is installed —
      # `.[dev]` alone would declare the tree AGPL-clean while never seeing the AI or platform packages.
      # Plain pip and no cache, on purpose: this job asks what a clean machine resolves *today*.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ai,dev,extraction,rules,platform,reports]"

      # `.coderabbit.yaml` is validated on every PR against a vendored copy of CodeRabbit's schema.
      # This asks the question the vendored copy cannot: does the config still satisfy what CodeRabbit
      # publishes *today*? If they tighten a constraint, the reviewer silently falls back to defaults —
      # the exact failure this whole check exists to catch, and one that leaves no red anywhere.
      #
      # Deliberately not comparing the two schemas for equality: CodeRabbit edits descriptions often,
      # and a check that goes red for upstream copywriting is one people learn to ignore.
      - name: Config still satisfies the published schema
        env:
          GV_CHECK_CODERABBIT_SCHEMA: "1"
        run: |
          pytest tests/test_repo_hygiene.py -q -k published_schema

      # The other thing a pull request cannot see. Nothing in this project is pinned — no lock file, and
      # every dependency is a floor (`pydantic>=2.10`, `shapely>=2`), so the set that gets installed on a
      # clean machine changes without any commit here. A PR run tells you the versions resolved *today*
      # were fine; it cannot tell you tomorrow's resolution still is.
      #
      # Two failures matter and both are silent otherwise: a new release that no longer resolves together,
      # and a dependency that changes licence. AGENTS.md §2.8 forbids AGPL, and the licence gate only ever
      # sees whatever happens to be installed.
      - name: Dependencies still resolve, and are still licence-clean
        run: |
          pip check
          pytest tests/test_licences.py -q
