name: CI

on:
  push:
    branches: [main]
  # `ready_for_review` so a draft that is marked ready gets its run; every job below skips drafts.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Weekly, for the one check that needs the network: has CodeRabbit's published config schema moved
  # under us? The offline check keeps passing against the vendored copy, so without this the copy can go
  # stale indefinitely and an upstream constraint change would surface as a collapsed warning in a PR
  # comment — the same signal that hid the original config defect for eight days.
  schedule:
    - cron: "0 6 * * 1"
  # A manual run. With `store_durations` ticked it also records how long every test took on CI's own
  # runners, to refresh `.test_durations` (steps under the test shards below).
  workflow_dispatch:
    inputs:
      store_durations:
        description: "Also record every test's duration and upload them, to refresh .test_durations"
        type: boolean
        default: false

# A newer push to the same branch cancels the older run: two runs of the same suite on a superseded
# commit tell nobody anything, and the second one to finish overwrites the first's answer.
#
# **Minutes are billed.** The repository is private (`gh repo view` reports `visibility=PRIVATE`,
# 2026-10-09; an earlier comment here said public, which is no longer true), so every job's runtime counts
# against the plan's quota, rounded up to the whole minute per job. That is why every job has a timeout,
# draft pull requests do not run, and Python packages install with uv from a cache.
#
# **No path filters, deliberately.** A documentation-only change can fail this workflow and must: the
# risk register, issue-gate and ADR tests read docs/, README.md and CONTRIBUTING.md, so a docs-only
# change can break the build. Skipping "docs-only" pushes would skip exactly those tests.
# No check in this workflow scans files for client values: the client-facts test only checks that
# docs/CLIENT_FACTS.md parses, and the vendor-neutrality test checks imports. Keeping client values out
# of GitHub is a review rule, not something CI enforces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality_checks:
    name: Python quality
    # Not on the weekly schedule. That cron exists for the one network check below, so the schedule
    # buys the drift check and not a second full run of everything: a weekly rerun of an unchanged tree
    # answers no question. Not on draft pull requests either; marking one ready runs everything.
    if: github.event_name != 'schedule' && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a commit SHA, and the checkout credential is dropped. zizmor flags both: a floating tag
      # can be moved under us by anyone who controls the upstream repository, and a persisted credential
      # can leave the runner inside an artifact. Nothing in this workflow writes to git — the only git
      # command is `git ls-files`, which needs no auth — and the one step that talks to the API gets its
      # token from `GH_TOKEN` in the environment, not from the checkout. Verified before changing this.
      # `fetch-depth: 1` is the action's default; written down so nobody turns on full history by accident.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      # Python 3.12 is the declared target in AGENTS.md section 4. Test the floor
      # we promise, not whatever is newest.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # uv installs the same floors as pip (`uv pip install`, no lock file, highest versions, as pip
      # resolves them) in seconds instead of most of a minute, from a cache keyed on pyproject.toml.
      # Local development already uses uv. The weekly job below keeps plain pip on purpose: it asks what
      # a clean machine resolves today.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # `reports` joins the list with D2.1 (#225): tests/reports/ imports reportlab and pypdf at
      # module level, so without it the redline tests do not skip, they fail to collect.
      - name: Install
        # `ocr` is here so the RapidOCR adapter is actually exercised. The engine is injectable and
        # every wiring test uses a stub, so without the extra the adapter itself would run in no test
        # anywhere — and a skipped test reads as coverage.
        run: uv pip install --system -e ".[ai,dev,extraction,ocr,rules,platform,reports]"

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      # Strict in the safety-critical zones. mypy is a no-op while these packages
      # are empty, and starts biting the moment real code lands.
      - name: Mypy (strict — verdict, rules, evidence)
        run: mypy verdict rules evidence

      - name: Mypy (rest of the tree)
        run: mypy app workflow extraction retrieval reports eval
        continue-on-error: true

      # Check the test-shard partition before any shard's result is trusted: the four lists must be
      # nonempty, disjoint, and together exactly the full collection. Collection runs no test.
      #
      # **Here, not on shard 1 (#1283).** It used to run on shard 1 before its tests, adding about 75 s
      # to the slowest job of the run. This job installs exactly the same extras as the shards (keep the
      # two Install lines identical, so both collect the same tests), finishes long before the shards,
      # and is already one of the jobs the required check `lint, types, tests` needs, so a coverage
      # failure still fails that check. The DATABASE_URL is the shards' own, so collection sees the same
      # environment; no database is needed or contacted to collect.
      - name: Verify complete, non-overlapping shard coverage
        env:
          DATABASE_URL: postgresql+psycopg://gv_test:gv_test@localhost:5432/gv_test
        run: python scripts/check_pytest_shard_coverage.py --splits 4

  test_shards:
    name: tests (shard ${{ matrix.group }}/4)
    if: github.event_name != 'schedule' && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    runs-on: ubuntu-latest
    # About 3-4.5 minutes each on four workers (#1289); a single-process recording run (below) takes
    # up to about 9. 12 leaves that run room and still stops a hung test before it drains the quota.
    timeout-minutes: 12
    # Four shards, kept. Billing rounds each job up to the minute, and each shard pays about half a
    # minute of fixed cost (database server, checkout, install). Two shards would bill a little less
    # and double the wait for a result.
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    env:
      DATABASE_URL: postgresql+psycopg://gv_test:gv_test@localhost:5432/gv_test

    steps:
      # GitHub hands out runners of different speeds. Measured in #1283, the same tests ran up to about
      # 1.5 times faster on one shard's runner than on another's in the same run, so a shard can be slow
      # because of its machine, not its tests. This line says which machine it got.
      - name: Runner CPU
        run: lscpu | grep -E '^(Model name|CPU\(s\)):'

      # Every shard runs its own PostgreSQL 17 server and database, installed on the runner itself.
      #
      # **No container image, so no registry pull limit (#1260).** The database used to be a service
      # container. Docker Hub's anonymous pull limit failed every shard on 2026-10-09/10 (#1156), so it
      # moved to Amazon's public mirror of the official image, and that mirror has an anonymous limit
      # too: on 2026-10-14 five shards died with "toomanyrequests: Data limit exceeded" before a test
      # ran, and a re-run passed. Instead of trading one registry's limit for another's, nothing is
      # pulled: PostgreSQL 17 and pgvector come from the PostgreSQL project's own apt repository, the
      # same place the official image and the runner's preinstalled PostgreSQL got theirs.
      #
      # The test database looks exactly as it did to the tests: same user, password, database name
      # and port, so DATABASE_URL above did not change. Local development (docker-compose.yml) keeps
      # the pgvector image.
      #
      # What is pinned: the major version (17, in the package names), and the repository's signing key
      # by its full fingerprint, so a swapped key fails here rather than installing from anyone. The
      # exact minor release is not pinned on purpose: the repository only serves the current one, so a
      # pin would break on the next security release. The step prints what it installed.
      #
      # apt downloads are retried (three times, a short wait between) because a mirror blip should cost
      # seconds, not a red shard and a ten-minute re-run.
      - name: Start PostgreSQL 17 with pgvector
        env:
          PGDG_KEY: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          PGDG_FINGERPRINT: B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          PGDATA: ${{ runner.temp }}/pgdata
        run: |
          set -euo pipefail
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "::warning::attempt $attempt of 3 failed: $*"
              sleep $((attempt * 5))
            done
            return 1
          }

          # The runner's own PostgreSQL install leaves the repository key behind but not the
          # repository. Fetch the key only if it is missing; check its fingerprint either way.
          if [ ! -f "$PGDG_KEY" ]; then
            sudo install -d "$(dirname "$PGDG_KEY")"
            retry sudo curl -fsSL -o "$PGDG_KEY" https://www.postgresql.org/media/keys/ACCC4CF8.asc
          fi
          gpg --show-keys --with-colons "$PGDG_KEY" | awk -F: '$1 == "fpr" { print $10 }' \
            | grep -qx "$PGDG_FINGERPRINT" \
            || { echo "::error::PostgreSQL apt key fingerprint is not $PGDG_FINGERPRINT"; exit 1; }
          codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          echo "deb [signed-by=$PGDG_KEY] https://apt.postgresql.org/pub/repos/apt $codename-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list

          # Install the programs only. Debian's packaging would otherwise create and start a default
          # server of its own; this job starts exactly one, below, as the runner user.
          echo "create_main_cluster = false" | sudo tee -a /etc/postgresql-common/createcluster.conf
          retry sudo apt-get update -qq -o Acquire::Retries=3
          retry sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            -o Acquire::Retries=3 postgresql-17 postgresql-17-pgvector
          sudo systemctl stop postgresql.service
          dpkg-query -W postgresql-17 postgresql-17-pgvector

          # The same server the service container gave: UTF-8 with the en_US locale, UTC, password
          # login (scram-sha-256) over TCP, and gv_test as the superuser that owns the gv_test database.
          bin=/usr/lib/postgresql/17/bin
          echo gv_test > "$RUNNER_TEMP/pgpass"
          "$bin/initdb" --pgdata="$PGDATA" --username=gv_test --pwfile="$RUNNER_TEMP/pgpass" \
            --auth-host=scram-sha-256 --auth-local=trust --encoding=UTF8 --locale=en_US.UTF-8 \
            --set timezone=UTC --set port=5432 --set listen_addresses=localhost \
            --set unix_socket_directories="$RUNNER_TEMP" > /dev/null
          "$bin/pg_ctl" start --wait --timeout=60 --log="$RUNNER_TEMP/postgres.log" \
            || { cat "$RUNNER_TEMP/postgres.log"; exit 1; }
          PGPASSWORD=gv_test "$bin/createdb" --host=localhost --port=5432 --username=gv_test gv_test
          "$bin/pg_isready" --host=localhost --port=5432 --username=gv_test --dbname=gv_test --timeout=30

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install test dependencies
        run: uv pip install --system -e ".[ai,dev,extraction,ocr,rules,platform,reports]"

      # The shard-coverage check (the four shards together run every test exactly once) runs in the
      # `Python quality` job, not here; see the comment there.
      #
      # **Balancing.** `least_duration` deals tests out by their recorded times in `.test_durations`,
      # so the shards only finish together while those times are current. A test missing from the file
      # is counted at the average. Refresh the file when the same shard is the slowest by more than about
      # 20% run after run, or when many tests have been added since the last refresh (compare the count
      # the shard-coverage check prints with the number of names in the file). One run's spread alone
      # is not a reason: the runners differ in speed (see "Runner CPU" above), and no split of the
      # tests can fix that.
      #
      #   1. Run this workflow by hand on any branch with `store_durations` ticked (Actions > CI > Run
      #      workflow, or `gh workflow run ci.yml --ref <branch> -f store_durations=true`). Every shard
      #      runs exactly the tests it always runs, splits by the committed file as usual, and also
      #      writes the times of its own tests (`--clean-durations` drops everyone else's), then
      #      uploads them as the artifact `test-durations-shard-<n>`.
      #   2. When the run is green, download the four files and join them (the shards are disjoint, so
      #      this is a plain union), as CONTRIBUTING.md "Refreshing the test-shard timings" shows.
      #   3. Commit the new `.test_durations` in a pull request; that PR's run shows the new balance.
      #
      # Only CI's times are valid: a laptop runs the suite at a different speed, test by test.
      #
      # **Four workers per shard (#1289).** The runner has 4 CPUs (the "Runner CPU" step prints them), and
      # one pytest process used one. `-n 4` (pytest-xdist) runs the shard's tests on four worker processes.
      # The split is unchanged: every worker collects the whole suite, keeps the same shard with the same
      # pytest-split arguments, and xdist stops the run if two workers disagree on the list, so the shard
      # runs exactly the tests it ran before, each once. Each worker gets its own database on this job's
      # server (`gv_test_gw0` ... `gv_test_gw3`), created and dropped by `tests/conftest.py`, so workers
      # never share a row, a schema or an extension. `--dist loadgroup` keeps any test marked
      # `@pytest.mark.xdist_group(...)` on one worker; tests that must not run beside a twin carry it.
      # **Such a mark changes the test's name (#1293).** xdist renames it `<id>@<group>` before
      # pytest-split picks the shard, so the shard-coverage check (no xdist, plain names) would prove a
      # different split from this one. No test is marked today; the first mark must come with a coverage
      # check that collects the same names (CONTRIBUTING.md, "Running the tests on several workers";
      # `tests/app/test_worker_databases.py` fails until then).
      #
      # **The recording run stays single-process**, exactly as before: the times it records are the ones
      # the split balances, and a worker's per-test time also counts the other three competing for the
      # machine. It takes about the old shard time (7-8 minutes), and it is run by hand, rarely.
      - name: Run complete pytest shard
        env:
          GROUP: ${{ matrix.group }}
          STORE_DURATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.store_durations }}
        run: |
          set -euo pipefail
          if [ "$STORE_DURATIONS" = true ]; then
            # `--durations-path=FILE`, one word, on purpose. Written as two words, pytest takes a file
            # outside the checkout as a path to test, moves its root directory up to the common parent,
            # and every test name gains a prefix: no recorded time then matches a test, the split falls
            # back to equal counts, and the recorded names are useless. The check after it makes sure.
            # No `-n`: single-process on purpose (see above), so no worker database either.
            recorded="$RUNNER_TEMP/test-durations-shard-$GROUP.json"
            cp .test_durations "$recorded"
            pytest -q --splits 4 --group "$GROUP" \
              --splitting-algorithm least_duration \
              --durations-path="$recorded" \
              --store-durations --clean-durations
            python - "$recorded" <<'PY'
          import json, sys
          names = json.load(open(sys.argv[1]))
          wrong = [name for name in names if not name.startswith("tests/")]
          if not names or wrong:
              sys.exit(f"recorded test names are not tests/...: {len(wrong)} of {len(names)}, e.g. {wrong[:3]}")
          print(f"recorded the times of {len(names)} tests")
          PY
          else
            pytest -q -n 4 --dist loadgroup --splits 4 --group "$GROUP" \
              --splitting-algorithm least_duration \
              --durations-path .test_durations
          fi

      # Only on a recording run, and only when the shard passed (an `if` without a status function
      # means `success() &&`): the times of a failed run are not worth keeping.
      - name: Upload this shard's recorded test durations
        if: github.event_name == 'workflow_dispatch' && inputs.store_durations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-durations-shard-${{ matrix.group }}
          path: ${{ runner.temp }}/test-durations-shard-${{ matrix.group }}.json
          if-no-files-found: error
          retention-days: 7

  # Keep the existing required branch-protection check name. It aggregates the quality job (which
  # also runs the shard-coverage check) and every matrix shard, so a failed or skipped shard, or shards
  # that do not cover the suite exactly once, cannot be hidden by another green job.
  required_ci:
    name: lint, types, tests
    needs: [quality_checks, test_shards]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: >-
      always() && github.event_name != 'schedule'
      && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    steps:
      - name: Require every quality and test shard job to pass
        env:
          QUALITY_RESULT: ${{ needs.quality_checks.result }}
          TEST_SHARDS_RESULT: ${{ needs.test_shards.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TEST_SHARDS_RESULT" = success

  # The frontend sat in the repository unchecked, and a dependency conflict shipped to main as a
  # result: openapi-typescript pins peer typescript@^5.x, the project is on 6, and `npm ci` failed
  # from a clean checkout while all four Python checks stayed green. A working tree that already has
  # node_modules never has to resolve that, which is exactly why it was invisible.
  #
  # `api:check` is the one that matters most. src/api/schema.d.ts is generated from the API's own
  # OpenAPI document, and the guarantee — rename a field on the server and the frontend stops
  # compiling — is only real if regenerating is verified to produce no diff.
  #
  # **Board status drift runs here too (#1283)**; it used to be a job of its own. One job fewer per run
  # means one runner slot fewer, but not fewer billed minutes: this job and `Python quality` each grew by
  # about a minute, so a run bills about the same. Two things claim to say whether a story may be worked
  # on: the contract in the issue body, which scripts/issue_gate.py reads, and the status label, which
  # every human, board view and filter reads. Nothing made them agree, so
  # they drifted — a sweep found eighteen disagreements across 135 open issues, twelve showing 'ready' on
  # work the gate stops. This is a board check, not a code check, so it can fail a pull request that
  # changed nothing. That is the point. The alternative is a sweep somebody remembers to run, and the
  # last one was the first one.
  #
  # Why this job and no other: the check needs an API token, and no job that runs the verdict tests may
  # hold one (`.coderabbit.yaml`). The test shards and `safety guards` run them; this job runs no pytest
  # suite but the board check's own test file, so it can hold the token. Only the board step gets it, in
  # its environment. It is not one of the jobs `lint, types, tests` needs, as the board job was not, so
  # the required check means what it meant before. The Python install below is a superset of what the
  # board check needs, so it costs no extra install.
  #
  # **The board check runs first, before Node is set up or `npm ci` runs (#1288)**, so no npm package's
  # install script has run on this machine while the token is in use. Its result is held until the end
  # (`continue-on-error`, then the last step fails the job if it failed), so a board disagreement does
  # not stop the frontend steps either: both answers arrive in every run.
  frontend:
    name: frontend (install, types, build) + board status drift
    if: github.event_name != 'schedule' && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    defaults:
      run:
        working-directory: frontend/main

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      # Python for the board check and for the API schema export (`api:check`, below).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install the API for schema export
        working-directory: .
        run: uv pip install --system -e ".[ai,dev,rules,platform,reports]"

      # Before any npm code has run (see the comment above the job). `continue-on-error` keeps the
      # frontend steps running after a board failure; the last step of the job turns it back into a red
      # job, so the failure is never lost.
      - name: Board status drift (label vs contract)
        id: board
        continue-on-error: true
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pytest tests/test_board_drift.py -q
          python scripts/check_board_drift.py

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/main/package-lock.json

      # `ci`, not `install`: it fails on a lockfile that disagrees with package.json rather than
      # quietly resolving something new, which is the whole reason this job exists.
      - name: Install
        run: npm ci

      - name: Types
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.app.json

      # What a reviewer sees — the elevation drawing, the cabinet dropdown, the findings table —
      # rendered and asserted, on captured server responses rather than a running server (#823).
      # Unrun, they broke in #807 and nothing noticed, because nothing ran them.
      - name: Component tests
        run: npm run test:components

      # The new shadcn/ui components, clicked and opened in jsdom (Vitest), plus the guards that keep
      # Tailwind from touching the legacy pages: every old stylesheet stays in the legacy layer, no
      # old class name becomes a utility, and the new colour tokens meet contrast (#1029).
      - name: Interactive component tests
        run: npm run test:ui

      - name: Build
        run: ./node_modules/.bin/vite build

      # Needs Python, because the schema is exported from the route table rather than fetched from a
      # running server - that is what makes it safe here and unable to drift from what is deployed.
      - name: Generated API types are current
        run: npm run api:check

      # The board check's answer, held since the start of the job. Runs only when every step above
      # passed (a failed frontend step has already made the job red).
      - name: Board status drift result
        if: steps.board.outcome == 'failure'
        working-directory: .
        run: |
          echo "::error::Board status drift failed; see the 'Board status drift (label vs contract)' step."
          exit 1

  # ---------------------------------------------------------------------------
  # Guards. These are the checks that turn the project's invariants from prose
  # into build failures. Each is added by its own issue; until then the step is
  # a placeholder so the wiring is obvious.
  #
  #   #33  licence policy   — fail on any AGPL dependency (e.g. pymupdf)
  #   #36  verdict isolation — fail if verdict/ imports extraction, retrieval,
  #                            network or model code, or contains eval(
  #   #38  repo hygiene      — fail if anything under data/ is ever tracked
  # ---------------------------------------------------------------------------
  guards:
    name: safety guards
    if: github.event_name != 'schedule' && !(github.event_name == 'pull_request' && github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # **No token in this job, deliberately.** It runs tests/test_verdict_isolation.py, and
    # `.coderabbit.yaml` says to flag any use of credentials in a job that runs the verdict tests. The
    # board-drift check needs an API token, so it lives in the `frontend` job above rather than lending
    # this one a credential it has no business holding.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      # Cheap and useful today: proprietary client material must never be
      # committed. Full version lands with #38.
      - name: No client data in version control
        run: |
          if git ls-files --error-unmatch data/ >/dev/null 2>&1; then
            echo "::error::Files under data/ are tracked. Client drawings and"
            echo "::error::checklists are proprietary and must never be committed."
            git ls-files data/
            exit 1
          fi
          echo "OK — nothing under data/ is tracked."

      # The most important invariant in the product: AGENTS.md section 2.1 forbids any
      # path from AI, OCR or retrieval into the verdict. Asserts the import table in
      # docs/DESIGN.md section 2, transitively.
      #
      # NB: a bare ' #' in a YAML scalar starts a comment before the shell sees the
      # line, which truncates the command. Use block scalars and avoid '#' in them.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      # Same extras as the quality job, deliberately. A minimal install was cheaper but meant a
      # guard could fail to *collect* on a missing optional dependency while passing locally —
      # that happened twice (#157 on PyYAML, and a root conftest on SQLAlchemy). A guard that does
      # not run is worse than a slow one.
      - name: Install test tooling
        run: uv pip install --system -e ".[ai,dev,extraction,rules,platform]"

      - name: Verdict isolation
        run: |
          pytest tests/test_verdict_isolation.py -q

      # Custom rules encoding the golden rules at the expression level, where the
      # import-graph test cannot reach: no float or rounding in the decision path, no
      # defaulted tolerance, no PASS returned from an exception handler.
      #
      # Semgrep OSS runs entirely on the runner — no account, no login, and no code
      # leaves. That matters because the client's rule logic is commercially sensitive.
      - name: Install semgrep
        run: uv pip install --system semgrep

      - name: Prove database float-column guard
        run: pytest tests/app/test_float_column_guard.py -q

      # The setting proposer may point at a passage, never write a setting (#849). Run here because
      # this job has semgrep installed; elsewhere the file's semgrep tests skip.
      - name: Prove the proposer-never-writes-a-setting guard
        run: pytest tests/workflow/test_proposer_never_writes_a_setting.py -q

      - name: Golden rules (semgrep)
        run: |
          semgrep --config .semgrep/gv-rules.yaml --error --quiet

      # Every risk in the architecture's register must name a control that exists. Runs after
      # semgrep because it verifies semgrep rule ids among other references, and after the other
      # guards because it is the guard that checks the guards are still there.
      #
      # It fails in both directions: an ENFORCED control whose artifact is missing, and a PLANNED
      # one whose artifact has quietly appeared. The second is what stops the register drifting
      # into a document nobody trusts.
      - name: Risk-control traceability
        run: |
          pytest tests/test_risk_controls.py -q


  # ---------------------------------------------------------------------------
  # Weekly only. Everything else in this workflow must pass or fail for reasons
  # inside the repository; this one asks a question about the outside world, so
  # it is kept away from the pull-request path where a network blip would look
  # like a broken change.
  # ---------------------------------------------------------------------------
  weekly:
    name: weekly checks (config schema, dependencies)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Pinned to commit SHAs and with the checkout credential dropped, both on zizmor's advice: an
      # unpinned tag can be moved under us, and a persisted credential can leak through an artifact.
      # This job needs neither — it reads the tree and talks to one public URL. The comments name the
      # tags so the pins are still readable.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # The full extra set, because the licence check below is only as good as what is installed —
      # `.[dev]` alone would declare the tree AGPL-clean while never seeing the AI or platform packages.
      # Plain pip and no cache, on purpose: this job asks what a clean machine resolves *today*.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ai,dev,extraction,rules,platform,reports]"

      # `.coderabbit.yaml` is validated on every PR against a vendored copy of CodeRabbit's schema.
      # This asks the question the vendored copy cannot: does the config still satisfy what CodeRabbit
      # publishes *today*? If they tighten a constraint, the reviewer silently falls back to defaults —
      # the exact failure this whole check exists to catch, and one that leaves no red anywhere.
      #
      # Deliberately not comparing the two schemas for equality: CodeRabbit edits descriptions often,
      # and a check that goes red for upstream copywriting is one people learn to ignore.
      - name: Config still satisfies the published schema
        env:
          GV_CHECK_CODERABBIT_SCHEMA: "1"
        run: |
          pytest tests/test_repo_hygiene.py -q -k published_schema

      # The other thing a pull request cannot see. Nothing in this project is pinned — no lock file, and
      # every dependency is a floor (`pydantic>=2.10`, `shapely>=2`), so the set that gets installed on a
      # clean machine changes without any commit here. A PR run tells you the versions resolved *today*
      # were fine; it cannot tell you tomorrow's resolution still is.
      #
      # Two failures matter and both are silent otherwise: a new release that no longer resolves together,
      # and a dependency that changes licence. AGENTS.md §2.8 forbids AGPL, and the licence gate only ever
      # sees whatever happens to be installed.
      - name: Dependencies still resolve, and are still licence-clean
        run: |
          pip check
          pytest tests/test_licences.py -q
