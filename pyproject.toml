[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gv-v1"
version = "0.1.0"
description = "Graniti Vicentia V1 — AI-assisted shop drawing review"
requires-python = ">=3.12"
# units/ and verdict/ run on the standard library alone — that is what lets the verdict
# service stay isolated, and tests/test_verdict_isolation.py enforces it.
#
# rules/ is permitted pydantic (docs/DESIGN.md section 2) because rule files are authored
# by humans and must be validated strictly before publication. Evidence polygons wrap
# Shapely rather than exposing it. Pydantic is MIT and Shapely is BSD-3-Clause.
dependencies = ["pydantic>=2.10", "shapely>=2"]

# Approved V1 stack, per AGENTS.md §4. Declared here so the licence policy applies to
# them, but not installed until their phase lands (see AGENTS.md §8 build order).
#
# NO AGPL — never add PyMuPDF or Ultralytics YOLO. Enforced by tests/test_licences.py,
# which fails the build rather than trusting this comment.
[project.optional-dependencies]
# `httpx` is here rather than in `platform` because it is only the ASGI test client —
# starlette imports it from `starlette.testclient` and nothing in the running service
# needs it. BSD-3-Clause.
# `jsonschema` (MIT) validates `.coderabbit.yaml` against CodeRabbit's published schema, vendored in
# `tests/fixtures/`. It was already installed transitively via semgrep and mcp; declared here because a
# test that depends on a tool's transitive dependency breaks the day that tool changes its mind.
dev = ["pytest", "ruff", "black", "mypy", "httpx", "jsonschema"]

# Phase 1-2 — extraction (all MIT / Apache / MPL)
extraction = [
    "pdfplumber",
    "pypdfium2",
    "pikepdf",
    "opencv-python-headless",
]

# Phase 3 — rule authoring: YAML loading. Validation itself is a runtime dependency.
rules = ["pyyaml"]

# Phase 4 — bounded extraction agent. LangGraph and its PostgreSQL saver are MIT
# licensed; hard safety bounds remain in our nodes rather than framework defaults.
ai = ["langgraph>=1,<2", "langgraph-checkpoint-postgres>=3,<4"]

# Phase 6 — control plane and durable platform
platform = [
    "fastapi",
    # C2.1 (#203): typed settings validated at startup, and the ASGI server.
    # pydantic-settings MIT · uvicorn BSD-3-Clause · starlette BSD-3-Clause (via fastapi).
    "pydantic-settings",
    "uvicorn",
    "sqlalchemy>=2",
    "alembic",
    # LGPL-2.0-or-later with the PostgreSQL linking exception; not AGPL.
    "psycopg[binary]",
    "hatchet-sdk",
    "boto3",
    "opentelemetry-sdk",
]

# Phase 7 — reports and redlines. Licences checked when D2.1 (#225) first imported them:
# reportlab BSD (and its Pillow dependency MIT-CMU) · pypdf BSD-3-Clause · openpyxl MIT.
# PyMuPDF is the obvious library for this job and is the forbidden one — AGPL, AGENTS.md §2.8.
reports = ["reportlab", "pypdf", "openpyxl"]

# Flat layout with several top-level packages: setuptools cannot auto-discover it,
# and without this it tries to package data/ and frontend/ too. List them explicitly.
[tool.setuptools.packages.find]
include = [
    "app*", "workflow*", "extraction*", "evidence*", "rules*", "storage*",
    "verdict*", "retrieval*", "reports*", "eval*", "units*",
]
exclude = ["data*", "frontend*", "docs*", "tests*", "scripts*", ".venv*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
# Pin the target: without it black formats for the newest Python it knows about,
# which then fails to parse on the 3.12 CI runs.
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
# Extra-strict in the safety-critical zones:
# verdict/, rules/, evidence/ must type-check clean before merge.

[tool.pytest.ini_options]
testpaths = ["tests"]
