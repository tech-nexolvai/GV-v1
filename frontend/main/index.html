<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-graniti.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Drawing review for Graniti Vicentia — recorded values, deterministic checks, reviewer sign-off." />
    <title>GV Review · Graniti Vicentia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    />
    <script>
      // Set the theme before the first paint, so a dark-mode reviewer never sees a white flash.
      // The reviewer's own choice wins; otherwise follow the system. Storage can be blocked
      // (private windows), which simply falls through to the system setting.
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('gv-theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
