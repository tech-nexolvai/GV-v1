id: CT-WIDTH-001
version: 1.1.0
product_type: countertop
check_type: internal
severity: FLAG
arithmetic_unit: in

name: Countertop width verification
description: >
  Compare the shop countertop's authored overall inch width with the exact length of the row
  under it plus the layout-driven field-cut allowance. The row is every piece under the
  countertop, left to right, whatever kind each piece is; where no piece list is given, it is
  the same assembly's cabinets plus its fillers, as before. Both given with different totals is
  a question for the reviewer, never a choice between them. The cabinet-run filler that may be
  trimmed on site remains a piece of the row; it is not one of the countertop's separate
  one-inch field-cut allowances.

applicability:
  discriminator: wall_config
  variants:
    - when: back_left_right
      extras:
        field_cut_count: 2
    - when: back_only
      extras:
        field_cut_count: 0
    - when: island
      extras:
        field_cut_count: 0

inputs:
  countertop_width:
    source: SHOP
    semantic_type: countertop_overall_width
    scope: same_assembly
    cardinality: one
  piece_widths:
    source: SHOP
    semantic_type: countertop_piece_width
    scope: same_assembly
    cardinality: many
  cabinet_widths:
    source: SHOP
    semantic_type: cabinet_width
    scope: same_assembly
    cardinality: many
  filler_widths:
    source: SHOP
    semantic_type: filler_width
    scope: same_assembly
    cardinality: many

parameters:
  field_cut:
    scope: project
    default:
      value: 1
      unit: in
    note: >-
      company standard 1 in per wall end (Raj, CLIENT_FACTS Q1: "1 inch is typical, customizable
      per project"; adopted by the admin on 2026-10-07). A company or project value replaces it.

derivations:
  - name: row_width
    operation: row_total
    operands:
      pieces: piece_widths
      cabinets: cabinet_widths
      fillers: filler_widths
  - name: field_cut_total
    operation: scale
    operands:
      value: field_cut
      multiplier: field_cut_count
  - name: expected_width
    operation: sum
    operands:
      values:
        - row_width
        - field_cut_total

operation:
  type: equals
  operands:
    actual: countertop_width
    expected: expected_width

on_missing: NOT_FOUND
on_ambiguous: REVIEW_REQUIRED
