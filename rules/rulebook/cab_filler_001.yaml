id: CAB-FILLER-001
version: 2.1.1
product_type: cabinet
check_type: arch_vs_shop
severity: FLAG
arithmetic_unit: in

name: Cabinet run distribution
description: >
  Check a shop drawing's cabinet run against the site. The fillers absorb the difference between
  the architectural width and the reviewer-supplied site width first, down to their bound. What
  they cannot absorb is divided equally between the regular cabinets. An equipment cabinet keeps
  its width in both directions, because an opening too wide for the appliance is as wrong as one
  too narrow. Which cabinets are equipment is the reviewer's classification, supplied per cabinet;
  the engine computes from it and never infers it.

  Where the client's specification is silent the check abstains rather than choosing: a remainder
  that does not divide into a width a drawing can carry, and a change that has to be shared between
  fillers that started unequal, both come back for a reviewer to settle.

# Global, where version 1 discriminated on `filler_symmetry` to select an `allow_asymmetric` flag
# for `filler_distribution`. The new operation has no such flag — it abstains on unequal fillers
# that must move, with the numbers in hand — so a discriminator here would select nothing and
# abstain whenever `filler_symmetry` was unknown, for no reason. The safety it provided now lives
# in the arithmetic, which is a better place for it: applicability decides whether to look, and
# only the arithmetic knows whether the fillers actually have to move.
applicability:
  scope: global

inputs:
  field_width:
    source: USER_INPUT
    semantic_type: field_dimension
    scope: same_assembly
    cardinality: one
  design_width:
    source: ARCH
    semantic_type: CT001
    scope: same_assembly
    cardinality: one
  architectural_fillers:
    source: ARCH
    semantic_type: filler_width
    scope: same_assembly
    cardinality: many
  shop_fillers:
    source: SHOP
    semantic_type: filler_width
    scope: same_assembly
    cardinality: many
  architectural_cabinets:
    source: ARCH
    semantic_type: cabinet_width
    scope: same_assembly
    cardinality: many
  shop_cabinets:
    source: SHOP
    semantic_type: cabinet_width
    scope: same_assembly
    cardinality: many
  # The reviewer's own classification, for the same reason `field_width` is a USER_INPUT: it is not
  # on either drawing as a value this system can read. The client lead's deck, slide 11 — the reviewer draws a
  # box around a cabinet and categorises it.
  cabinet_type:
    source: USER_INPUT
    semantic_type: cabinet_category
    scope: same_assembly
    cardinality: many

# **The filler bounds follow the client lead's written rule** — the admin's decision, 2026-10-02: stick with what
# the client lead said. His email states the rule: "Keep minimum filler width as 1" and create a mutable variable
# which can be adjusted later", and for the maximum "please use 2"" (CLIENT_FACTS Q8, Q21). His
# 2026-09-21 deck's two worked examples use 2" and 3" instead; a number inside an example does not
# replace a rule he wrote, so the defaults are 1" and 2", every finding that relies on them says the
# examples differ, and the client lead is asked which is right (#674). Global, so a project or run value — the client lead's
# "mutable variable" — replaces them, and the override report shows it.
#
# The per-type cabinet bounds still carry no default: the client lead has never given them ("we will provide the
# complete list we typically follow for the final run"). A parameter no layer supplies is NOT_FOUND
# (#67, AGENTS.md §2.4), which sends a reviewer to find the number rather than handing them a
# confident verdict computed from a guess.
parameters:
  filler_min:
    default:
      value: "1"
      unit: in
    scope: global
    note: >-
      1" is the client lead's written rule (his email: "Keep minimum filler width as 1""). The worked examples
      in his 2026-09-21 deck use 2" — awaiting his confirmation (#674).
  filler_max:
    default:
      value: "2"
      unit: in
    scope: global
    note: >-
      2" is the client lead's written rule (his email: "please use 2""). The worked examples in his 2026-09-21
      deck use 3" — awaiting his confirmation (#674).
  single_door_cab_width_min:
    scope: project
  single_door_cab_width_max:
    scope: project
  double_door_cab_width_min:
    scope: project
  double_door_cab_width_max:
    scope: project
  drawer_cab_width_min:
    scope: project
  drawer_cab_width_max:
    scope: project

operation:
  type: cabinet_run_distribution
  operands:
    field_width: field_width
    design_width: design_width
    design_fillers: architectural_fillers
    proposed_fillers: shop_fillers
    design_cabinets: architectural_cabinets
    proposed_cabinets: shop_cabinets
    cabinet_type: cabinet_type
    single_door_cab_width_min: single_door_cab_width_min
    single_door_cab_width_max: single_door_cab_width_max
    double_door_cab_width_min: double_door_cab_width_min
    double_door_cab_width_max: double_door_cab_width_max
    drawer_cab_width_min: drawer_cab_width_min
    drawer_cab_width_max: drawer_cab_width_max
    filler_min: filler_min
    filler_max: filler_max

on_missing: NOT_FOUND
on_ambiguous: REVIEW_REQUIRED
